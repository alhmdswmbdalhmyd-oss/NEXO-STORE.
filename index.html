<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO STORE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Cairo,Arial,sans-serif;
  background:#fff;
  color:#111;
}
button,input,select{font-family:inherit}

#splash{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
#splash h1{
  color:#087cff;
  font-size:38px;
  font-weight:800;
}
#splash p{
  margin-top:8px;
  color:#777;
}
.loader{
  width:180px;
  height:4px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin-top:18px;
}
.loader span{
  display:block;
  height:100%;
  width:0;
  background:#087cff;
  animation:load 1.8s forwards;
}
@keyframes load{to{width:100%}}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid #eee;
  padding:12px 15px;
}
.headerInner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.logo{
  font-size:24px;
  font-weight:800;
  color:#087cff;
}
.cartBtn{
  position:relative;
  border:0;
  background:#087cff;
  color:#fff;
  width:45px;
  height:45px;
  border-radius:14px;
  font-size:21px;
  cursor:pointer;
}
.cartCount{
  position:absolute;
  top:-5px;
  left:-5px;
  background:#ff304f;
  color:#fff;
  width:20px;
  height:20px;
  border-radius:50%;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px 14px 100px;
}

.delivery{
  background:linear-gradient(90deg,#087cff,#00a8ff);
  color:#fff;
  border-radius:18px;
  padding:13px;
  text-align:center;
  font-weight:700;
  margin-bottom:15px;
  overflow:hidden;
}
.delivery span{
  display:inline-block;
  animation:moveText 5s linear infinite;
}
@keyframes moveText{
  0%{transform:translateX(100%)}
  100%{transform:translateX(-100%)}
}

.search{
  width:100%;
  border:1px solid #ddd;
  border-radius:14px;
  padding:13px 15px;
  outline:none;
  font-size:15px;
  margin-bottom:13px;
}
.search:focus{border-color:#087cff}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
}
.categories button{
  white-space:nowrap;
  border:1px solid #ddd;
  background:#fff;
  border-radius:20px;
  padding:8px 14px;
  cursor:pointer;
}
.categories button.active{
  background:#087cff;
  color:#fff;
  border-color:#087cff;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  border:1px solid #eee;
  border-radius:18px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}
.product img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:contain;
  background:#fafafa;
  cursor:pointer;
  display:block;
}
.productInfo{
  padding:11px;
}
.productName{
  font-size:14px;
  font-weight:700;
  min-height:43px;
}
.oldPrice{
  color:#999;
  text-decoration:line-through;
  font-size:12px;
  margin-top:5px;
}
.price{
  color:#087cff;
  font-size:19px;
  font-weight:800;
}
.buy{
  width:100%;
  border:0;
  background:#087cff;
  color:#fff;
  border-radius:11px;
  padding:10px;
  margin-top:8px;
  cursor:pointer;
  font-weight:700;
}

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
}
.modal.show{display:flex}

.modalBox{
  background:#fff;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  border-radius:22px;
  padding:18px;
  position:relative;
}

#cartModal{
  opacity:0;
  transition:opacity .25s ease;
}
#cartModal.show{opacity:1}
#cartModal .modalBox{
  width:calc(100% - 24px);
  max-width:430px;
  max-height:75vh;
  margin:auto;
  transform:translateY(30px) scale(.95);
  opacity:0;
  transition:.3s ease;
}
#cartModal.show .modalBox{
  transform:translateY(0) scale(1);
  opacity:1;
}

.close{
  position:absolute;
  left:12px;
  top:10px;
  border:0;
  background:#f2f2f2;
  width:34px;
  height:34px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

.detailImage{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:15px;
  background:#fafafa;
}
.detailTitle{
  font-size:21px;
  font-weight:800;
  margin-top:12px;
}
.detailDesc{
  color:#666;
  margin:8px 0;
  line-height:1.8;
}

.cartItem{
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:10px 0;
}
.cartItem img{
  width:60px;
  height:60px;
  object-fit:contain;
  border-radius:10px;
  background:#fafafa;
}
.cartItemInfo{flex:1}
.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:5px;
}
.qty button{
  border:0;
  width:27px;
  height:27px;
  border-radius:8px;
  background:#eee;
  cursor:pointer;
}
.remove{
  border:0;
  background:#ffe8e8;
  color:#e22;
  padding:6px 8px;
  border-radius:8px;
  cursor:pointer;
}

.totalBox{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #eee;
}
.totalRow{
  display:flex;
  justify-content:space-between;
  margin:7px 0;
}
.total{
  font-size:20px;
  font-weight:800;
  color:#087cff;
}

.form{
  display:grid;
  gap:10px;
}
.form input,.form textarea,.form select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
}
.form textarea{min-height:90px;resize:vertical}

.empty{
  text-align:center;
  padding:30px 10px;
  color:#777;
}

.floatCart{
  position:fixed;
  bottom:18px;
  left:18px;
  z-index:150;
  border:0;
  background:#087cff;
  color:#fff;
  width:58px;
  height:58px;
  border-radius:50%;
  font-size:23px;
  box-shadow:0 8px 25px rgba(8,124,255,.35);
  cursor:pointer;
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.07)}
}

@media(min-width:700px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div id="splash">
  <h1>NEXO STORE</h1>
  <p>جاري تجهيز المتجر...</p>
  <div class="loader"><span></span></div>
</div>

<header>
  <div class="headerInner">
    <div class="logo">NEXO STORE</div>
    <button class="cartBtn" onclick="openCart()">
      🛒
      <span class="cartCount" id="cartCount">0</span>
    </button>
  </div>
</header>

<div class="container">

  <div class="delivery">
    <span>🚚 التوصيل فقط داخل مكة</span>
  </div>

  <input
    id="search"
    class="search"
    placeholder="ابحث عن منتج..."
    oninput="renderProducts()"
  >

  <div class="categories">
    <button class="active" onclick="setCategory('الكل',this)">الكل</button>
    <button onclick="setCategory('شواحن',this)">شواحن</button>
    <button onclick="setCategory('كيابل',this)">كيابل</button>
    <button onclick="setCategory('سماعات',this)">سماعات</button>
    <button onclick="setCategory('سيارات',this)">سيارات</button>
    <button onclick="setCategory('متنوع',this)">متنوع</button>
  </div>

  <div id="products" class="products"></div>

</div>

<button class="floatCart" onclick="openCart()">🛒</button>

<!-- تفاصيل المنتج -->
<div class="modal" id="productModal">
  <div class="modalBox">
    <button class="close" onclick="closeModal('productModal')">×</button>
    <img id="detailImage" class="detailImage" alt="صورة المنتج">
    <div id="detailTitle" class="detailTitle"></div>
    <div id="detailDesc" class="detailDesc"></div>
    <div id="detailPrice"></div>
    <button class="buy" onclick="addDetailToCart()">إضافة للسلة</button>
  </div>
</div>

<!-- السلة -->
<div class="modal" id="cartModal">
  <div class="modalBox">
    <button class="close" onclick="closeModal('cartModal')">×</button>
    <h2>🛒 سلة المشتريات</h2>
    <div id="cartItems"></div>

    <div class="totalBox">
      <div class="totalRow">
        <span>المجموع</span>
        <strong id="subtotal">0 ريال</strong>
      </div>

      <input
        id="coupon"
        class="search"
        style="margin-top:8px"
        placeholder="كود الخصم"
      >

      <button class="buy" onclick="applyCoupon()">تطبيق الخصم</button>

      <div class="totalRow">
        <span>الخصم</span>
        <strong id="discount">0 ريال</strong>
      </div>

      <div class="totalRow">
        <span>التوصيل</span>
        <strong>15 ريال</strong>
      </div>

      <div class="totalRow total">
        <span>الإجمالي</span>
        <strong id="total">0 ريال</strong>
      </div>

      <button class="buy" onclick="openOrder()">إتمام الطلب</button>
    </div>
  </div>
</div>

<!-- الطلب -->
<div class="modal" id="orderModal">
  <div class="modalBox">
    <button class="close" onclick="closeModal('orderModal')">×</button>
    <h2>إتمام الطلب</h2>

    <div class="form">
      <input id="customerName" placeholder="الاسم">
      <input id="phone" placeholder="رقم الجوال">
      <textarea id="address" placeholder="العنوان داخل مكة"></textarea>

      <select id="deliveryMethod">
        <option value="توصيل">توصيل</option>
        <option value="استلام">استلام</option>
      </select>

      <select id="paymentMethod">
        <option value="دفع عند الاستلام">دفع عند الاستلام</option>
        <option value="تحويل بنكي">تحويل بنكي</option>
      </select>

      <button class="buy" onclick="sendOrder()">تأكيد الطلب عبر واتساب</button>
    </div>
  </div>
</div>

<script>
const products = [

  {
    id:"p1",
    name:"FASTER FT-21 - شاحن جداري بمنفذين USB",
    oldPrice:30,
    price:15,
    category:"شواحن",
    image:"faster-ft71.jpg",
    desc:"شاحن جداري عملي بمنفذين USB للاستخدام اليومي."
  },

  {
    id:"p2",
    name:"LDNIO LS543 - كيبل Type-C إلى Lightning",
    oldPrice:20,
    price:10,
    category:"كيابل",
    image:"ldnio-ls543.jpg",
    desc:"كيبل Type-C إلى Lightning للشحن ونقل البيانات."
  },

  {
    id:"p3",
    name:"OVAST OT-15 - كيبل Type-C 3.1A",
    oldPrice:10,
    price:5,
    category:"كيابل",
    image:"ovast-ot15.jpg",
    desc:"كيبل Type-C للشحن بقوة 3.1A."
  },

  {
    id:"p4",
    name:"NITO N-100 - سماعة سلكية بميكروفون",
    oldPrice:10,
    price:5,
    category:"سماعات",
    image:"nito-n100.jpg",
    desc:"سماعة سلكية بميكروفون للاستخدام اليومي."
  },

  {
    id:"p5",
    name:"iPlus I-18 - سماعة Lightning",
    oldPrice:10,
    price:5,
    category:"سماعات",
    image:"iplus-i18.jpg",
    desc:"سماعة Lightning سلكية بتصميم عملي."
  },

  {
    id:"p6",
    name:"GLOW GLH-32 - حامل مغناطيسي 360°",
    oldPrice:30,
    price:15,
    category:"سيارات",
    image:"glow-glh32.jpg",
    desc:"حامل جوال مغناطيسي للسيارة مع دوران 360 درجة."
  },

  {
    id:"p7",
    name:"NITO N-H673 - سماعة رأس Type-C",
    oldPrice:20,
    price:10,
    category:"سماعات",
    image:"nito-nh673.jpg",
    desc:"سماعة سلكية بمنفذ Type-C."
  },

  {
    id:"p8",
    name:"KUMS - كيبل Type-C مضفر 1.2m 3.4A",
    oldPrice:10,
    price:5,
    category:"كيابل",
    image:"kums-typec-1200mm.jpg",
    desc:"كيبل Type-C مضفر بطول 1.2 متر وقوة 3.4A."
  },

  {
    id:"p9",
    name:"WINMFIX LED - لمبة 3 في 1 وحامل جوال",
    oldPrice:10,
    price:5,
    category:"متنوع",
    image:"winmfix-led.jpg",
    desc:"لمبة LED متعددة الاستخدامات مع حامل للجوال."
  },

  {
    id:"p10",
    name:"X.LOOD X-73 - كيبل Type-C 3.1A",
    oldPrice:10,
    price:5,
    category:"كيابل",
    image:"xlood-x73.jpg",
    desc:"كيبل Type-C للشحن بقوة 3.1A."
  },

  {
    id:"p11",
    name:"UNIVERSAL CLIP - حامل مرآة للسيارة",
    oldPrice:30,
    price:15,
    category:"سيارات",
    image:"universal-clip.jpg",
    desc:"حامل جوال يثبت على مرآة السيارة."
  },

  {
    id:"p12",
    name:"GLOW GLH-29 - حامل مغناطيسي للسيارة",
    oldPrice:30,
    price:15,
    category:"سيارات",
    image:"glow-glh29.jpg",
    desc:"حامل مغناطيسي عملي للسيارة."
  },

  {
    id:"p13",
    name:"NITO CH-512 - شاحن بمنفذين",
    oldPrice:30,
    price:15,
    category:"شواحن",
    image:"nito-ch512.jpg",
    desc:"شاحن سيارة بمنفذين للشحن."
  },

  {
    id:"p14",
    name:"PROMASS PM-8509 - شاحن PD+QC 38W",
    oldPrice:30,
    price:15,
    category:"شواحن",
    image:"promass-pm8509.jpg",
    desc:"شاحن سريع يدعم PD وQC بقدرة 38W."
  },

  {
    id:"p15",
    name:"GLOW GLH-26 - حامل مغناطيسي صغير للسيارة",
    oldPrice:30,
    price:15,
    category:"سيارات",
    image:"glow-glh26.jpg",
    desc:"حامل مغناطيسي صغير وعملي للسيارة."
  }

];

let category="الكل";
let cart=JSON.parse(localStorage.getItem("nexo_cart")||"[]");
let selectedProduct=null;
let discount=0;

function saveCart(){
  localStorage.setItem("nexo_cart",JSON.stringify(cart));
  updateCartCount();
}

function updateCartCount(){
  document.getElementById("cartCount").textContent =
    cart.reduce((sum,item)=>sum+item.qty,0);
}

function setCategory(cat,button){
  category=cat;
  document.querySelectorAll(".categories button")
    .forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  renderProducts();
}

function renderProducts(){

  const box=document.getElementById("products");
  const search=document.getElementById("search").value.trim().toLowerCase();

  const list=products.filter(p=>{
    const matchCategory=category==="الكل"||p.category===category;
    const matchSearch=p.name.toLowerCase().includes(search);
    return matchCategory&&matchSearch;
  });

  box.innerHTML=list.map(p=>`
    <div class="product">
      <img
        src="${p.image}"
        alt="${p.name}"
        onerror="this.style.opacity='0.3';"
        onclick="openProduct('${p.id}')"
      >

      <div class="productInfo">
        <div class="productName">${p.name}</div>

        <div class="oldPrice">${p.oldPrice} ريال</div>
        <div class="price">${p.price} ريال</div>

        <button class="buy" onclick="addToCart('${p.id}')">
          إضافة للسلة
        </button>
      </div>
    </div>
  `).join("");
}

function openProduct(id){
  selectedProduct=products.find(p=>p.id===id);

  document.getElementById("detailImage").src=selectedProduct.image;
  document.getElementById("detailTitle").textContent=selectedProduct.name;
  document.getElementById("detailDesc").textContent=selectedProduct.desc;

  document.getElementById("detailPrice").innerHTML=`
    <div class="oldPrice">${selectedProduct.oldPrice} ريال</div>
    <div class="price">${selectedProduct.price} ريال</div>
  `;

  document.getElementById("productModal").classList.add("show");
}

function addDetailToCart(){
  if(selectedProduct){
    addToCart(selectedProduct.id);
    closeModal("productModal");
  }
}

function addToCart(id){
  const product=products.find(p=>p.id===id);
  if(!product)return;

  const existing=cart.find(x=>x.id===id);

  if(existing){
    existing.qty++;
  }else{
    cart.push({
      id:id,
      qty:1
    });
  }

  saveCart();
  openCart();
}

function changeQty(id,amount){
  const item=cart.find(x=>x.id===id);
  if(!item)return;

  item.qty+=amount;

  if(item.qty<=0){
    cart=cart.filter(x=>x.id!==id);
  }

  saveCart();
  renderCart();
}

function removeItem(id){
  cart=cart.filter(x=>x.id!==id);
  saveCart();
  renderCart();
}

function renderCart(){

  const box=document.getElementById("cartItems");

  if(cart.length===0){
    box.innerHTML=`<div class="empty">السلة فارغة 🛒</div>`;
    document.getElementById("subtotal").textContent="0 ريال";
    document.getElementById("discount").textContent="0 ريال";
    document.getElementById("total").textContent="0 ريال";
    return;
  }

  let subtotal=0;

  box.innerHTML=cart.map(item=>{

    const p=products.find(x=>x.id===item.id);
    if(!p)return "";

    subtotal+=p.price*item.qty;

    return `
      <div class="cartItem">
        <img src="${p.image}" alt="${p.name}">

        <div class="cartItemInfo">
          <strong>${p.name}</strong>
          <div>${p.price} ريال</div>

          <div class="qty">
            <button onclick="changeQty('${p.id}',-1)">−</button>
            <span>${item.qty}</span>
            <button onclick="changeQty('${p.id}',1)">+</button>
          </div>
        </div>

        <button class="remove" onclick="removeItem('${p.id}')">
          حذف
        </button>
      </div>
    `;
  }).join("");

  const discountValue=Math.round(subtotal*discount);
  const delivery=cart.length?15:0;
  const total=Math.max(0,subtotal-discountValue+delivery);

  document.getElementById("subtotal").textContent=subtotal+" ريال";
  document.getElementById("discount").textContent=discountValue+" ريال";
  document.getElementById("total").textContent=total+" ريال";
}

function applyCoupon(){

  const code=document.getElementById("coupon").value.trim().toUpperCase();

  if(code==="NEXO50"){
    discount=.5;
    alert("تم تطبيق خصم 50%");
  }else{
    discount=0;
    alert("كود الخصم غير صحيح");
  }

  renderCart();
}

function openCart(){
  renderCart();
  document.getElementById("cartModal").classList.add("show");
}

function openOrder(){

  if(cart.length===0){
    return;
  }

  closeModal("cartModal");
  document.getElementById("orderModal").classList.add("show");
}

function closeModal(id){
  document.getElementById(id).classList.remove("show");
}

function sendOrder(){

  if(cart.length===0)return;

  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const address=document.getElementById("address").value.trim();
  const delivery=document.getElementById("deliveryMethod").value;
  const payment=document.getElementById("paymentMethod").value;

  if(!name||!phone||!address){
    alert("أكمل بيانات الطلب");
    return;
  }

  let subtotal=0;
  let itemsText="";

  cart.forEach(item=>{
    const p=products.find(x=>x.id===item.id);
    if(!p)return;

    subtotal+=p.price*item.qty;

    itemsText+=
      `• ${p.name} × ${item.qty} = ${p.price*item.qty} ريال\n`;
  });

  const discountValue=Math.round(subtotal*discount);
  const deliveryFee=delivery==="استلام"?0:15;
  const total=subtotal-discountValue+deliveryFee;

  const orderId=
    "NEXO-"+Math.floor(10000000+Math.random()*90000000);

  const order={
    orderId,
    customerName:name,
    phone,
    address,
    deliveryMethod:delivery,
    paymentMethod:payment,
    items:cart,
    subtotal,
    discount:discountValue,
    deliveryFee,
    total,
    status:"جديد",
    createdAt:new Date().toISOString()
  };

  const orders=
    JSON.parse(localStorage.getItem("nexo_orders")||"[]");

  orders.push(order);

  localStorage.setItem(
    "nexo_orders",

`طلب جديد من NEXO STORE

${itemsText}

  const url=
