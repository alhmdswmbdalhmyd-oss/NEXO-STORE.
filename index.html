<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXO STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Cairo",sans-serif;
  background:#f7f9fc;
  color:#111827;
  min-height:100vh;
}

button,input,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   شاشة الترحيب
========================= */

#splash{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  transition:opacity .45s ease,visibility .45s ease;
}

#splash.hide{
  opacity:0;
  visibility:hidden;
}

.splashLogo{
  font-size:38px;
  font-weight:900;
  letter-spacing:2px;
  color:#111827;
  margin-bottom:14px;
}

.splashLogo span{
  color:#1683ff;
}

.splashText{
  font-size:14px;
  color:#555;
  margin-bottom:18px;
}

.loadingLine{
  width:210px;
  height:4px;
  background:#e8edf5;
  border-radius:50px;
  overflow:hidden;
}

.loadingLine span{
  display:block;
  height:100%;
  width:35%;
  background:#1683ff;
  border-radius:50px;
  animation:loading 1.15s infinite ease-in-out;
}

@keyframes loading{
  0%{
    transform:translateX(280%);
  }
  50%{
    transform:translateX(80%);
  }
  100%{
    transform:translateX(-280%);
  }
}

/* =========================
   الهيدر
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #edf0f5;
  padding:12px 15px;
}

.headerInner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:23px;
  font-weight:900;
  color:#111827;
}

.logo span{
  color:#1683ff;
}

.cartBtn{
  border:0;
  background:#1683ff;
  color:#fff;
  border-radius:13px;
  padding:9px 13px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:7px;
}

.cartCount{
  background:#fff;
  color:#1683ff;
  min-width:22px;
  height:22px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

/* =========================
   المحتوى
========================= */

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.searchBox{
  margin-bottom:12px;
}

.searchBox input{
  width:100%;
  height:48px;
  border:1px solid #e1e7ef;
  border-radius:14px;
  background:#fff;
  padding:0 16px;
  outline:none;
  font-size:14px;
}

.searchBox input:focus{
  border-color:#1683ff;
  box-shadow:0 0 0 3px rgba(22,131,255,.08);
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:12px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.catBtn{
  white-space:nowrap;
  border:1px solid #e0e6ee;
  background:#fff;
  color:#333;
  padding:8px 14px;
  border-radius:30px;
  font-size:13px;
  font-weight:700;
}

.catBtn.active{
  background:#1683ff;
  color:#fff;
  border-color:#1683ff;
}

.deliveryBanner{
  background:linear-gradient(90deg,#1683ff,#36a1ff);
  color:#fff;
  border-radius:17px;
  padding:13px 16px;
  margin-bottom:17px;
  text-align:center;
  font-weight:800;
  font-size:14px;
  overflow:hidden;
}

.deliveryBanner span{
  display:inline-block;
  animation:bannerMove 3s ease-in-out infinite;
}

@keyframes bannerMove{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(-12px)}
}

.productsGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

@media(min-width:700px){
  .productsGrid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

/* =========================
   المنتج
========================= */

.productCard{
  background:#fff;
  border:1px solid #edf0f5;
  border-radius:18px;
  overflow:hidden;
  transition:.2s;
}

.productCard:active{
  transform:scale(.98);
}

.productImage{
  width:100%;
  aspect-ratio:1/1;
  background:#f5f7fa;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.productImage img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.productInfo{
  padding:11px;
}

.productName{
  font-size:13px;
  font-weight:800;
  line-height:1.6;
  min-height:42px;
}

.priceArea{
  margin-top:7px;
}

.oldPrice{
  color:#9ca3af;
  text-decoration:line-through;
  font-size:12px;
}

.newPrice{
  color:#1683ff;
  font-size:18px;
  font-weight:900;
}

.addBtn{
  width:100%;
  border:0;
  background:#111827;
  color:#fff;
  border-radius:11px;
  padding:9px;
  margin-top:9px;
  font-weight:800;
}

.addBtn:hover{
  background:#1683ff;
}

/* =========================
   النوافذ
========================= */

#cartModal,
#productModal,
#orderModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:500;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modalBox{
  background:#fff;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  border-radius:22px 22px 0 0;
  padding:18px;
}

/* السلة صغيرة ومتحركة فقط */

#cartModal{
  opacity:0;
  transition:opacity .25s ease;
}

#cartModal.show{
  opacity:1;
}

#cartModal .modalBox{
  width:calc(100% - 24px);
  max-width:430px;
  max-height:75vh;
  margin-bottom:12px;
  border-radius:22px;
  transform:translateY(110%);
  opacity:0;
  transition:
    transform .3s cubic-bezier(.22,.8,.3,1),
    opacity .25s ease;
}

#cartModal.show .modalBox{
  transform:translateY(0);
  opacity:1;
}

.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modalHead strong{
  font-size:18px;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#f1f3f6;
  font-size:23px;
  color:#333;
}

/* =========================
   تفاصيل المنتج
========================= */

.detailImage{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:16px;
  background:#f5f7fa;
  margin-bottom:15px;
}

.detailTitle{
  font-size:20px;
  font-weight:900;
  margin-bottom:7px;
}

.detailDescription{
  color:#666;
  line-height:1.8;
  font-size:14px;
}

.optionTitle{
  font-weight:800;
  margin:15px 0 8px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.optionBtn{
  border:1px solid #dce2ea;
  background:#fff;
  border-radius:10px;
  padding:9px 13px;
  font-weight:700;
}

.optionBtn.active{
  border-color:#1683ff;
  background:#1683ff;
  color:#fff;
}

.qtyRow{
  display:flex;
  align-items:center;
  gap:10px;
  margin:15px 0;
}

.qtyBtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#eef4fb;
  font-size:20px;
}

.qtyValue{
  min-width:35px;
  text-align:center;
  font-weight:900;
}

.primaryBtn{
  width:100%;
  border:0;
  background:#1683ff;
  color:#fff;
  border-radius:13px;
  padding:12px;
  font-weight:900;
  font-size:15px;
}

/* =========================
   السلة
========================= */

.cartItem{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #edf0f5;
}

.cartItemImage{
  width:62px;
  height:62px;
  background:#f5f7fa;
  border-radius:12px;
  object-fit:contain;
  flex-shrink:0;
}

.cartItemInfo{
  flex:1;
}

.cartItemName{
  font-size:13px;
  font-weight:800;
  line-height:1.5;
}

.cartItemPrice{
  color:#1683ff;
  font-weight:900;
  font-size:13px;
}

.cartControls{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:5px;
}

.smallQty{
  width:28px;
  height:28px;
  border:0;
  background:#edf3fa;
  border-radius:8px;
}

.removeBtn{
  border:0;
  background:#fff0f0;
  color:#e11d48;
  border-radius:8px;
  padding:6px 8px;
  font-size:11px;
}

.cartTotal{
  margin-top:15px;
  background:#f5f8fc;
  border-radius:13px;
  padding:13px;
}

.totalRow{
  display:flex;
  justify-content:space-between;
  margin:5px 0;
}

.totalRow.final{
  font-size:18px;
  font-weight:900;
  color:#1683ff;
  border-top:1px solid #dde4ed;
  padding-top:9px;
  margin-top:9px;
}

.emptyCart{
  text-align:center;
  color:#777;
  padding:35px 10px;
}

/* =========================
   الطلب
========================= */

.formGroup{
  margin-bottom:12px;
}

.formGroup label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:5px;
}

.formGroup input,
.formGroup select,
.formGroup textarea{
  width:100%;
  border:1px solid #dfe5ed;
  border-radius:11px;
  padding:11px;
  outline:none;
  background:#fff;
  font-size:14px;
}

.formGroup textarea{
  min-height:90px;
  resize:vertical;
}

.couponRow{
  display:flex;
  gap:7px;
}

.couponRow input{
  flex:1;
}

.couponBtn{
  border:0;
  background:#111827;
  color:#fff;
  border-radius:11px;
  padding:0 14px;
  font-weight:800;
}

.couponMsg{
  font-size:12px;
  margin-top:5px;
}

/* =========================
   السلة العائمة
========================= */

.floatCart{
  position:fixed;
  left:15px;
  bottom:17px;
  z-index:400;
}

.floatCart button{
  border:0;
  background:#1683ff;
  color:#fff;
  border-radius:50px;
  padding:12px 17px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(22,131,255,.3);
  animation:floatCart 2.2s ease-in-out infinite;
}

@keyframes floatCart{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-5px);
  }
}

/* =========================
   إشعار
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%) translateY(20px);
  background:#111827;
  color:#fff;
  padding:10px 16px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:2000;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<!-- شاشة الترحيب -->
<div id="splash">
  <div class="splashLogo">NEXO <span>STORE</span></div>
  <div class="splashText">جاري تجهيز المتجر...</div>
  <div class="loadingLine">
    <span></span>
  </div>
</div>

<header>
  <div class="headerInner">
    <div class="logo">NEXO <span>STORE</span></div>

    <button class="cartBtn" onclick="openCart()">
      🛒 السلة
      <span class="cartCount" id="cartCount">0</span>
    </button>
  </div>
</header>

<main class="container">

  <div class="searchBox">
    <input
      id="searchInput"
      type="search"
      placeholder="ابحث عن منتج..."
      oninput="renderProducts()"
    >
  </div>

  <div class="categories">
    <button class="catBtn active" onclick="setCategory('الكل',this)">الكل</button>
    <button class="catBtn" onclick="setCategory('شواحن',this)">شواحن</button>
    <button class="catBtn" onclick="setCategory('كيابل',this)">كيابل</button>
    <button class="catBtn" onclick="setCategory('سماعات',this)">سماعات</button>
    <button class="catBtn" onclick="setCategory('سيارات',this)">سيارات</button>
    <button class="catBtn" onclick="setCategory('إكسسوارات',this)">إكسسوارات</button>
  </div>

  <div class="deliveryBanner">
    <span>🚚 التوصيل داخل مكة المكرمة فقط</span>
  </div>

  <div class="productsGrid" id="productsGrid"></div>

</main>

<!-- السلة -->
<div id="cartModal">
  <div class="modalBox">

    <div class="modalHead">
      <strong>سلة المشتريات</strong>
      <button class="close" onclick="closeModal('cartModal')">×</button>
    </div>

    <div id="cartContent"></div>

  </div>
</div>

<!-- تفاصيل المنتج -->
<div id="productModal">
  <div class="modalBox">

    <div class="modalHead">
      <strong>تفاصيل المنتج</strong>
      <button class="close" onclick="closeModal('productModal')">×</button>
    </div>

    <div id="productContent"></div>

  </div>
</div>

<!-- الطلب -->
<div id="orderModal">
  <div class="modalBox">

    <div class="modalHead">
      <strong>إتمام الطلب</strong>
      <button class="close" onclick="closeModal('orderModal')">×</button>
    </div>

    <div class="formGroup">
      <label>الاسم</label>
      <input id="customerName" type="text" placeholder="اكتب اسمك">
    </div>

    <div class="formGroup">
      <label>رقم الجوال</label>
      <input id="customerPhone" type="tel" placeholder="05xxxxxxxx">
    </div>

    <div class="formGroup">
      <label>العنوان</label>
      <textarea id="customerAddress" placeholder="اكتب عنوان التوصيل داخل مكة"></textarea>
    </div>

    <div class="formGroup">
      <label>طريقة الاستلام</label>
      <select id="deliveryMethod" onchange="updateOrderTotal()">
        <option value="delivery">توصيل داخل مكة - 15 ريال</option>
        <option value="pickup">استلام</option>
      </select>
    </div>

    <div class="formGroup">
      <label>طريقة الدفع</label>
      <select id="paymentMethod">
        <option value="cash">الدفع عند الاستلام</option>
        <option value="card">بطاقة / شبكة</option>
      </select>
    </div>

    <div class="formGroup">
      <label>كود الخصم</label>
      <div class="couponRow">
        <input id="couponInput" type="text" placeholder="NEXO50">
        <button class="couponBtn" onclick="applyCoupon()">تطبيق</button>
      </div>
      <div id="couponMsg" class="couponMsg"></div>
    </div>

    <div class="cartTotal" id="orderSummary"></div>

    <button class="primaryBtn" onclick="submitOrder()">
      تأكيد الطلب
    </button>

  </div>
</div>

<div class="floatCart">
  <button onclick="openCart()">🛒 عرض السلة</button>
</div>

<div class="toast" id="toast"></div>

window.addEventListener("load",()=>{
  renderProducts();
  updateCartCount();

  setTimeout(()=>{
    document.getElementById("splash").classList.add("hide");
  },1800);

/* =========================

function renderProducts(){

  const grid = document.getElementById("productsGrid");
  const search = document.getElementById("searchInput").value.trim().toLowerCase();

  let list = products.filter(p=>{

    const categoryMatch =
      currentCategory==="الكل" ||
      p.category===currentCategory;

    const searchMatch =
      !search ||
      p.name.toLowerCase().includes(search) ||
      p.description.toLowerCase().includes(search);

    return categoryMatch && searchMatch;
  });

  if(!list.length){
    grid.innerHTML=`
      <div style="
        grid-column:1/-1;
        background:#fff;
        border-radius:16px;
        padding:35px;
        text-align:center;
        color:#777;
      ">
        لا توجد منتجات مطابقة
      </div>
    `;
    return;
  }

  grid.innerHTML=list.map(p=>`

    <div class="productCard">

      <div class="productImage" onclick="openProduct('${p.id}')">
        <img
          src="${p.image}"
          alt="${escapeHtml(p.name)}"
          onerror="this.style.display='none'"
        >
      </div>

      <div class="productInfo">

        <div class="productName">
          ${escapeHtml(p.name)}
        </div>

        <div class="priceArea">
          <div class="oldPrice">
            ${p.marketPrice} ريال
          </div>

          <div class="newPrice">
            ${p.price} ريال
          </div>
        </div>

        <button class="addBtn" onclick="openProduct('${p.id}')">
          إضافة للسلة
        </button>

      </div>

    </div>

  `).join("");
}

function setCategory(category,button){

  currentCategory=category;

  document.querySelectorAll(".catBtn").forEach(btn=>{
    btn.classList.remove("active");
  });

  button.classList.add("active");

  renderProducts();
}

/* =========================
   تفاصيل المنتج
========================= */

function openProduct(id){

  selectedProduct=products.find(p=>p.id===id);

  if(!selectedProduct)return;

  selectedQty=1;

  document.getElementById("productContent").innerHTML=`

    <img
      class="detailImage"
      src="${selectedProduct.image}"
      alt="${escapeHtml(selectedProduct.name)}"
      onerror="this.style.display='none'"
    >

    <div class="detailTitle">
      ${escapeHtml(selectedProduct.name)}
    </div>

    <div class="detailDescription">
      ${escapeHtml(selectedProduct.description)}
    </div>

    <div class="priceArea" style="margin-top:12px">
      <div class="oldPrice">
        ${selectedProduct.marketPrice} ريال
      </div>

      <div class="newPrice">
        ${selectedProduct.price} ريال
      </div>
    </div>

    ${
      selectedProduct.optionName
      ?
      `
      <div class="optionTitle">النوع</div>

      <div class="options">
        <button class="optionBtn active">
          ${escapeHtml(selectedProduct.optionName)}
        </button>
      </div>
      `
      :
      ""
    }

    <div class="optionTitle">
      الكمية
    </div>

    <div class="qtyRow">

      <button class="qtyBtn" onclick="changeSelectedQty(-1)">
        −
      </button>

      <div class="qtyValue" id="selectedQty">
        1
      </div>

      <button class="qtyBtn" onclick="changeSelectedQty(1)">
        +
      </button>

    </div>

    <button class="primaryBtn" onclick="addSelectedToCart()">
      🛒 إضافة للسلة
    </button>

  `;

  document.getElementById("productModal").style.display="flex";
}

function changeSelectedQty(amount){

  if(!selectedProduct)return;

  selectedQty+=amount;

  if(selectedQty<1){
    selectedQty=1;
  }

  if(selectedQty>selectedProduct.quantity){
    selectedQty=selectedProduct.quantity;
  }

  document.getElementById("selectedQty").textContent=selectedQty;
}

function addSelectedToCart(){

  if(!selectedProduct)return;

  const existing=cart.find(
    item=>item.id===selectedProduct.id
  );

  if(existing){

    existing.qty+=selectedQty;

    if(existing.qty>selectedProduct.quantity){
      existing.qty=selectedProduct.quantity;
    }

  }else{

    cart.push({
      id:selectedProduct.id,
      name:selectedProduct.name,
      price:selectedProduct.price,
      marketPrice:selectedProduct.marketPrice,
      image:selectedProduct.image,
      qty:selectedQty,
      optionName:selectedProduct.optionName || ""
    });

  }

  saveCart();
  closeModal("productModal");

  showToast("تمت إضافة المنتج للسلة");
}

/* =========================
   السلة
========================= */

function openCart(){

  renderCart();

  const modal=document.getElementById("cartModal");

  modal.style.display="flex";

  requestAnimationFrame(()=>{
    modal.classList.add("show");
  });
}

function renderCart(){

  const content=document.getElementById("cartContent");

  if(!cart.length){

    content.innerHTML=`
      <div class="emptyCart">
        🛒<br>
        السلة فارغة
      </div>
    `;

    return;
  }

  let subtotal=0;

  cart.forEach(item=>{
    subtotal+=item.price*item.qty;
  });

  content.innerHTML=`

    ${cart.map(item=>`

      <div class="cartItem">

        <img
          class="cartItemImage"
          src="${item.image}"
          alt=""
          onerror="this.style.display='none'"
        >

        <div class="cartItemInfo">

          <div class="cartItemName">
            ${escapeHtml(item.name)}
          </div>

          ${
            item.optionName
            ?
            `<div style="font-size:11px;color:#777">
              ${escapeHtml(item.optionName)}
            </div>`
            :
            ""
          }

          <div class="cartItemPrice">
            ${item.price} ريال × ${item.qty}
          </div>

          <div class="cartControls">

            <button
              class="smallQty"
              onclick="changeCartQty('${item.id}',-1)"
            >
              −
            </button>

            <strong>${item.qty}</strong>

            <button
              class="smallQty"
              onclick="changeCartQty('${item.id}',1)"
            >
              +
            </button>

            <button
              class="removeBtn"
              onclick="removeFromCart('${item.id}')"
            >
              حذف
            </button>

          </div>

        </div>

      </div>

    `).join("")}

    <div class="cartTotal">

      <div class="totalRow">
        <span>المجموع</span>
        <strong>${subtotal} ريال</strong>
      </div>

      <button
        class="primaryBtn"
        style="margin-top:10px"
        onclick="openOrder()"
      >
        متابعة الطلب
      </button>

    </div>

  `;
}

function changeCartQty(id,amount){

  const item=cart.find(x=>x.id===id);

  if(!item)return;

  const product=products.find(x=>x.id===id);

  item.qty+=amount;

  if(item.qty<1){
    item.qty=1;
  }

  if(product && item.qty>product.quantity){
    item.qty=product.quantity;
  }

  saveCart();
  renderCart();
}

function removeFromCart(id){

  cart=cart.filter(item=>item.id!==id);

  saveCart();
  renderCart();

  showToast("تم حذف المنتج");
}

/* =========================
   الطلب
========================= */

function openOrder(){

  if(!cart.length){
    showToast("السلة فارغة");
    return;
  }

  closeModal("cartModal");

  document.getElementById("orderModal").style.display="flex";

  updateOrderTotal();
}

function calculateSubtotal(){

  return cart.reduce(
    (sum,item)=>sum+(item.price*item.qty),
    0
  );
}

function updateOrderTotal(){

  const subtotal=calculateSubtotal();

  let discount=0;

  if(couponApplied){
    discount=subtotal*0.5;
  }

  const deliveryMethod=
    document.getElementById("deliveryMethod").value;

  const deliveryFee=
    deliveryMethod==="delivery" ? 15 : 0;

  const total=
    subtotal-discount+deliveryFee;

  document.getElementById("orderSummary").innerHTML=`

    <div class="totalRow">
      <span>المجموع</span>
      <strong>${subtotal.toFixed(2)} ريال</strong>
    </div>

    <div class="totalRow">
      <span>الخصم</span>
      <strong>${discount.toFixed(2)} ريال</strong>
    </div>

    <div class="totalRow">
      <span>التوصيل</span>
      <strong>${deliveryFee.toFixed(2)} ريال</strong>
    </div>

    <div class="totalRow final">
      <span>الإجمالي</span>
      <strong>${total.toFixed(2)} ريال</strong>
    </div>

  `;
}

function applyCoupon(){

  const input=document.getElementById("couponInput");
  const msg=document.getElementById("couponMsg");

  const code=input.value.trim().toUpperCase();

  if(code==="NEXO50"){

    couponApplied=true;

    msg.style.color="#16a34a";
    msg.textContent="تم تطبيق خصم 50%";

    updateOrderTotal();

  }else{

    couponApplied=false;

    msg.style.color="#dc2626";
    msg.textContent="كود الخصم غير صحيح";

    updateOrderTotal();
  }
}

function submitOrder(){

  const name=
    document.getElementById("customerName").value.trim();

  const phone=
    document.getElementById("customerPhone").value.trim();

  const address=
    document.getElementById("customerAddress").value.trim();

  if(!name || !phone || !address){

    showToast("أكمل بيانات الطلب أولاً");
    return;
  }

  const deliveryMethod=
    document.getElementById("deliveryMethod").value;

  const paymentMethod=
    document.getElementById("paymentMethod").value;

  const subtotal=calculateSubtotal();

  const discount=
    couponApplied ? subtotal*.5 : 0;

  const deliveryFee=
    deliveryMethod==="delivery" ? 15 : 0;

  const total=
    subtotal-discount+deliveryFee;

  const orderId=
    "NEXO-"+Math.floor(10000000+Math.random()*90000000);

  const order={
    orderId,
    customerName:name,
    phone,
    address,
    deliveryMethod,
    paymentMethod,
    items:[...cart],
    subtotal,
    discount,
    deliveryFee,
    total,
    status:"جديد",
    createdAt:new Date().toISOString()
  };

  const orders=
    JSON.parse(localStorage.getItem("nexo_orders")||"[]");

  orders.push(order);

  localStorage.setItem(
    "nexo_orders",
    JSON.stringify(orders)
  );

  let message=
`طلب جديد من NEXO STORE%0A%0A`+
`رقم الطلب: ${orderId}%0A`+
`الاسم: ${name}%0A`+
`الجوال: ${phone}%0A`+
`العنوان: ${address}%0A%0A`+
`المنتجات:%0A`;

  cart.forEach(item=>{
    message+=
      `- ${item.name} × ${item.qty}%0A`;
  });

  message+=
`%0Aالمجموع: ${subtotal.toFixed(2)} ريال`+
`%0Aالخصم: ${discount.toFixed(2)} ريال`+
`%0Aالتوصيل: ${deliveryFee.toFixed(2)} ريال`+
`%0Aالإجمالي: ${total.toFixed(2)} ريال`+
`%0Aالدفع: ${paymentMethod}`;

  const whatsapp=
    "https://wa.me/966501203710?text="+message;

  cart=[];

  saveCart();

  couponApplied=false;

  document.getElementById("customerName").value="";
  document.getElementById("customerPhone").value="";
  document.getElementById("customerAddress").value="";
  document.getElementById("couponInput").value="";
  document.getElementById("couponMsg").textContent="";

  closeModal("orderModal");

  showToast("تم إنشاء الطلب "+orderId);

  setTimeout(()=>{
    window.open(whatsapp,"_blank");
  },700);
}

/* =========================
   إغلاق النوافذ
========================= */

function closeModal(id){

  const modal=document.getElementById(id);

  if(!modal)return;

  if(id==="cartModal"){

    modal.classList.remove("show");

    setTimeout(()=>{
      modal.style.display="none";
    },300);

  }else{

    modal.style.display="none";
  }
}

/* الضغط خارج السلة يغلقها */

document.getElementById("cartModal").addEventListener(
  "click",
  function(e){

    if(e.target===this){
      closeModal("cartModal");
    }

  }
);

/* الضغط خارج النوافذ الأخرى */

document.getElementById("productModal").addEventListener(
  "click",
  function(e){

    if(e.target===this){
      closeModal("productModal");
    }

  }
);

document.getElementById("orderModal").addEventListener(
  "click",
  function(e){

    if(e.target===this){
      closeModal("orderModal");
    }

  }
);

/* =========================
   التخزين
========================= */

function saveCart(){

  localStorage.setItem(
    "nexo_cart",
    JSON.stringify(cart)
  );

  updateCartCount();
}

function updateCartCount(){

  const count=cart.reduce(
    (sum,item)=>sum+item.qty,
    0
  );

  document.getElementById("cartCount").textContent=count;
}

/* =========================
   إشعار
========================= */

function showToast(text){

  const toast=document.getElementById("toast");

  toast.textContent=text;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    toast.classList.remove("show");
  },2200);
}

/* =========================
   حماية النص
========================= */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>
