<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXO STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:"Cairo",sans-serif;
    background:#f5f7fa;
    color:#111;
}

button,input,textarea,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   LOADER
========================= */

.loader{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    transition:opacity .35s ease,visibility .35s ease;
}

.loader.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loaderLogo{
    font-size:52px;
    font-weight:800;
    letter-spacing:1px;
    color:#0876d9;
    margin-bottom:25px;
}

.loaderLogo span{
    color:#111;
}

.loaderLine{
    width:220px;
    height:6px;
    background:#e8edf3;
    border-radius:20px;
    overflow:hidden;
    position:relative;
}

.loaderLine::after{
    content:"";
    position:absolute;
    top:0;
    right:100%;
    width:100%;
    height:100%;
    background:#0876d9;
    border-radius:20px;
    animation:loading 1.35s cubic-bezier(.4,0,.2,1) forwards;
}

.loaderText{
    color:#111;
    font-size:15px;
    font-weight:700;
    margin-top:14px;
}

@keyframes loading{
    0%{right:100%}
    72%{right:8%}
    88%{right:3%}
    100%{right:0}
}

/* =========================
   HEADER
========================= */

header{
    background:#fff;
    height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 18px;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    color:#0876d9;
    font-size:32px;
    font-weight:800;
    letter-spacing:.5px;
}

.logo span{
    color:#111;
}

.cartButton{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    width:62px;
    height:62px;
    border:0;
    border-radius:20px;
    background:#0876d9;
    font-size:28px;
    box-shadow:0 6px 18px rgba(8,118,217,.20);
    transition:.2s;
}

.cartButton:active{
    transform:translateY(-50%) scale(.94);
}

.cartNumber{
    position:absolute;
    top:-6px;
    right:-6px;
    width:31px;
    height:31px;
    background:#111;
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    font-weight:800;
    border:3px solid #fff;
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:20px 15px 60px;
}

.deliveryBanner{
    background:#eaf5ff;
    color:#0876d9;
    border-radius:20px;
    padding:16px;
    text-align:center;
    font-size:19px;
    font-weight:800;
    margin-bottom:16px;
}

.search{
    width:100%;
    height:56px;
    border:1px solid #ddd;
    border-radius:17px;
    padding:0 18px;
    font-size:17px;
    outline:none;
    background:#fff;
    margin-bottom:14px;
}

.search:focus{
    border-color:#0876d9;
}

.categories{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:18px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    white-space:nowrap;
    border:0;
    background:#fff;
    border-radius:14px;
    padding:10px 17px;
    font-weight:700;
    color:#555;
    transition:.2s;
}

.category.active{
    background:#0876d9;
    color:#fff;
}

/* =========================
   PRODUCTS
========================= */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.product{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    border:1px solid #e5e5e5;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
    transition:transform .18s ease,box-shadow .18s ease;
    cursor:pointer;
}

.product:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.productImg{
    width:100%;
    height:220px;
    object-fit:contain;
    display:block;
    background:#fff;
    padding:10px;
}

.productBody{
    padding:14px;
}

.productName{
    font-weight:800;
    font-size:16px;
    line-height:1.7;
    min-height:55px;
}

.productDescription{
    color:#777;
    font-size:13px;
    line-height:1.7;
    min-height:42px;
}

.oldPrice{
    color:#999;
    text-decoration:line-through;
    font-size:14px;
    margin-top:8px;
}

.price{
    color:#0876d9;
    font-size:24px;
    font-weight:800;
}

.addButton{
    width:100%;
    height:48px;
    border:0;
    border-radius:14px;
    background:#0876d9;
    color:#fff;
    font-size:16px;
    font-weight:800;
    margin-top:10px;
}

.addButton:active{
    transform:scale(.97);
}

/* =========================
   PRODUCT PAGE
========================= */

.productPage{
    position:fixed;
    inset:0;
    background:#f5f7fa;
    z-index:200;
    overflow-y:auto;
    visibility:hidden;
    opacity:0;
    transform:translateX(-20px);
    pointer-events:none;
    transition:opacity .22s ease,transform .22s ease,visibility .22s ease;
}

.productPage.show{
    visibility:visible;
    opacity:1;
    transform:translateX(0);
    pointer-events:auto;
}

.productPageHeader{
    height:74px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    position:sticky;
    top:0;
    z-index:10;
}

.productBack{
    position:absolute;
    right:15px;
    width:48px;
    height:48px;
    border:0;
    border-radius:15px;
    background:#f1f3f5;
    color:#111;
    font-size:27px;
    font-weight:800;
}

.productPageLogo{
    color:#0876d9;
    font-size:25px;
    font-weight:800;
}

.productPageLogo span{
    color:#111;
}

.productPageContent{
    max-width:1000px;
    margin:auto;
    padding:25px 15px 50px;
}

.productDetailCard{
    background:#fff;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.productDetailImageBox{
    width:100%;
    height:430px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    padding:20px;
}

.productDetailImage{
    width:100%;
    height:100%;
    object-fit:contain;
}

.productDetailInfo{
    padding:25px;
}

.productDetailName{
    font-size:28px;
    font-weight:800;
    line-height:1.6;
}

.productDetailDescription{
    color:#777;
    font-size:16px;
    line-height:2;
    margin-top:12px;
}

.productDetailOldPrice{
    color:#999;
    text-decoration:line-through;
    font-size:17px;
    margin-top:20px;
}

.productDetailPrice{
    color:#0876d9;
    font-size:34px;
    font-weight:800;
    margin-top:2px;
}

.productDetailActions{
    display:flex;
    gap:12px;
    margin-top:22px;
}

.productAdd{
    flex:1;
    height:58px;
    border:0;
    border-radius:17px;
    background:#0876d9;
    color:#fff;
    font-size:18px;
    font-weight:800;
}

.productCart{
    width:60px;
    height:58px;
    border:0;
    border-radius:17px;
    background:#111;
    color:#fff;
    font-size:25px;
}

/* =========================
   MODALS
========================= */

.modalBackground{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:10px;
}

.modalBackground.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:650px;
    max-height:94vh;
    overflow:auto;
    background:#fff;
    border-radius:30px;
    padding:28px;
    position:relative;
}

.closeButton{
    position:absolute;
    left:15px;
    top:15px;
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#f1f1f1;
    font-size:25px;
}

.modalTitle{
    font-size:26px;
    font-weight:800;
    margin-bottom:20px;
}

.cartItem{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.cartItem img{
    width:80px;
    height:80px;
    object-fit:contain;
    border-radius:14px;
    background:#fafafa;
}

.cartInfo{
    flex:1;
}

.cartName{
    font-weight:800;
    line-height:1.5;
}

.cartPrice{
    color:#0876d9;
    font-weight:800;
    margin-top:3px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:7px;
}

.quantity button{
    width:36px;
    height:36px;
    border:0;
    border-radius:11px;
    background:#edf0f3;
    font-size:20px;
}

.quantity span{
    min-width:25px;
    text-align:center;
    font-weight:800;
}

.delete{
    width:36px;
    height:36px;
    border:0;
    border-radius:10px;
    background:#ffe9e9;
}

.freeShipping{
    margin:15px 0;
    background:#edf7ed;
    color:#3c8144;
    border-radius:15px;
    padding:13px;
    text-align:center;
    font-weight:800;
}

.summary{
    margin-top:15px;
}

.summaryRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 0;
    font-size:18px;
}

.discountRow{
    color:#3c8144;
}

.totalRow{
    color:#0876d9;
    font-size:27px;
    font-weight:800;
    border-top:1px solid #eee;
    margin-top:7px;
    padding-top:15px;
}

.coupon{
    display:flex;
    gap:9px;
    margin-top:15px;
}

.coupon input{
    flex:1;
    height:57px;
    border:1px solid #d7dce2;
    border-radius:15px;
    background:#f5f8fc;
    padding:0 15px;
    font-size:17px;
    direction:ltr;
    text-align:right;
}

.coupon button{
    width:120px;
    border:0;
    border-radius:15px;
    background:#0876d9;
    color:#fff;
    font-size:17px;
    font-weight:800;
}

.couponMessage{
    margin-top:8px;
    font-size:14px;
    font-weight:800;
}

.success{
    color:#3b8144;
}

.error{
    color:#c62828;
}

.checkout{
    width:100%;
    height:58px;
    border:0;
    border-radius:17px;
    background:#0876d9;
    color:#fff;
    font-size:19px;
    font-weight:800;
    margin-top:17px;
}

.formGroup{
    margin-bottom:14px;
}

.formGroup label{
    display:block;
    font-weight:800;
    margin-bottom:6px;
}

.formGroup input,
.formGroup textarea,
.formGroup select{
    width:100%;
    border:1px solid #d7dce2;
    border-radius:14px;
    padding:12px;
    font-size:16px;
    outline:none;
    background:#fff;
}

.formGroup input,
.formGroup select{
    height:53px;
}

.formGroup textarea{
    height:100px;
    resize:none;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.option{
    border:2px solid #e0e3e7;
    border-radius:15px;
    padding:12px;
    text-align:center;
    font-weight:700;
}

.option.active{
    border-color:#0876d9;
    background:#edf6ff;
    color:#0876d9;
}

.empty{
    text-align:center;
    padding:45px 10px;
    color:#777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){
    .products{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){

    header{
        height:82px;
    }

    .logo{
        font-size:27px;
    }

    .cartButton{
        left:13px;
        width:57px;
        height:57px;
        font-size:26px;
        border-radius:18px;
    }

    .cartNumber{
        width:29px;
        height:29px;
        font-size:14px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .productImg{
        height:165px;
    }

    .productBody{
        padding:10px;
    }

    .productName{
        font-size:14px;
        min-height:50px;
    }

    .productDescription{
        font-size:11px;
    }

    .price{
        font-size:20px;
    }

    .addButton{
        height:44px;
        font-size:14px;
    }

    .deliveryBanner{
        font-size:17px;
    }

    .modal{
        padding:22px 16px;
    }

    .productPageContent{
        padding:12px 10px 30px;
    }

    .productDetailCard{
        border-radius:22px;
    }

    .productDetailImageBox{
        height:300px;
    }

    .productDetailInfo{
        padding:18px;
    }

    .productDetailName{
        font-size:21px;
    }

    .productDetailDescription{
        font-size:14px;
    }

    .productDetailPrice{
        font-size:29px;
    }

    .productDetailActions{
        gap:8px;
    }

    .productAdd{
        height:54px;
        font-size:16px;
    }

    .productCart{
        height:54px;
        width:55px;
    }
}
</style>
</head>

<body>

<!-- =========================
     WELCOME LOADER
========================= -->

<div class="loader" id="loader">
    <div class="loaderLogo">
        NEXO <span>STORE</span>
    </div>

    <div class="loaderLine"></div>

    <div class="loaderText">
        جاري تجهيز المتجر...
    </div>
</div>


<!-- =========================
     HEADER
========================= -->

<header>

    <button class="cartButton" onclick="openCart()">
        🛒
        <span class="cartNumber" id="cartNumber">0</span>
    </button>

    <div class="logo">
        NEXO <span>STORE</span>
    </div>

</header>


<!-- =========================
     STORE
========================= -->

<div class="container">

    <div class="deliveryBanner">
        🚚 التوصيل فقط داخل مكة
    </div>

    <input
        id="search"
        class="search"
        type="text"
        placeholder="ابحث عن منتج..."
        oninput="renderProducts()"
    >

    <div class="categories">

        <button
            class="category active"
            onclick="selectCategory('الكل',this)"
        >
            الكل
        </button>

        <button
            class="category"
            onclick="selectCategory('شواحن',this)"
        >
            شواحن
        </button>

        <button
            class="category"
            onclick="selectCategory('كيابل',this)"
        >
            كيابل
        </button>

        <button
            class="category"
            onclick="selectCategory('سماعات',this)"
        >
            سماعات
        </button>

        <button
            class="category"
            onclick="selectCategory('سيارات',this)"
        >
            سيارات
        </button>

        <button
            class="category"
            onclick="selectCategory('متنوع',this)"
        >
            متنوع
        </button>

    </div>

    <div class="products" id="products"></div>

</div>


<!-- =========================
     PRODUCT FULL PAGE
========================= -->

<div class="productPage" id="productPage">

    <div class="productPageHeader">

        <button
            class="productBack"
            onclick="closeProductPage()"
        >
            ←
        </button>

        <div class="productPageLogo">
            NEXO <span>STORE</span>
        </div>

    </div>

    <div class="productPageContent">

        <div class="productDetailCard">

            <div class="productDetailImageBox">

                <img
                    id="detailImage"
                    class="productDetailImage"
                    src=""
                    alt=""
                >

            </div>

            <div class="productDetailInfo">

                <div
                    id="detailName"
                    class="productDetailName"
                ></div>

                <div
                    id="detailDescription"
                    class="productDetailDescription"
                ></div>

                <div
                    id="detailOldPrice"
                    class="productDetailOldPrice"
                ></div>

                <div
                    id="detailPrice"
                    class="productDetailPrice"
                ></div>

                <div class="productDetailActions">

                    <button
                        id="detailAddButton"
                        class="productAdd"
                    >
                        أضف للسلة
                    </button>

                    <button
                        class="productCart"
                        onclick="openCart()"
                    >
                        🛒
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     CART
========================= -->

<div
    class="modalBackground"
    id="cartModal"
>

    <div class="modal">

        <button
            class="closeButton"
            onclick="closeModal('cartModal')"
        >
            ×
        </button>

        <div class="modalTitle">
            🛒 سلة المشتريات
        </div>

        <div id="cartItems"></div>

        <div
            id="emptyCart"
            class="empty"
            style="display:none"
        >
            السلة فارغة
        </div>

        <div id="cartContent">

            <div
                id="freeShipping"
                class="freeShipping"
            ></div>

            <div id="summary"></div>

            <div class="coupon">

                <input
                    id="couponInput"
                    type="text"
                    placeholder="NEXO50"
                    autocomplete="off"
                >

                <button onclick="applyCoupon()">
                    تطبيق
                </button>

            </div>

            <div
                id="couponMessage"
                class="couponMessage"
            ></div>

            <button
                class="checkout"
                onclick="openOrder()"
            >
                إتمام الطلب
            </button>

        </div>

    </div>

</div>


<!-- =========================
     ORDER
========================= -->

<div
    class="modalBackground"
    id="orderModal"
>

    <div class="modal">

        <button
            class="closeButton"
            onclick="closeModal('orderModal')"
        >
            ×
        </button>

        <div class="modalTitle">
            إتمام الطلب
        </div>

        <div class="formGroup">

            <label>الاسم</label>

            <input
                id="name"
                type="text"
                placeholder="اكتب اسمك"
            >

        </div>

        <div class="formGroup">

            <label>رقم الجوال</label>

            <input
                id="phone"
                type="tel"
                placeholder="05xxxxxxxx"
            >

        </div>

        <div class="formGroup">

            <label>العنوان</label>

            <textarea
                id="address"
                placeholder="اكتب عنوان التوصيل داخل مكة"
            ></textarea>

        </div>

        <div class="formGroup">

            <label>طريقة الاستلام</label>

            <div class="options">

                <div
                    id="deliveryOption"
                    class="option active"
                    onclick="setDelivery('delivery')"
                >
                    🚚 توصيل
                    <br>
                    <small>15 ريال</small>
                </div>

                <div
                    id="pickupOption"
                    class="option"
                    onclick="setDelivery('pickup')"
                >
                    🏪 استلام من الفرع
                    <br>
                    <small>مجاناً</small>
                </div>

            </div>

        </div>

        <div class="formGroup">

            <label>طريقة الدفع</label>

            <select id="payment">

                <option>
                    دفع عند الاستلام
                </option>

                <option>
                    تحويل بنكي
                </option>

            </select>

        </div>

        <div id="orderSummary"></div>

        <button
            class="checkout"
            onclick="sendOrder()"
        >
            تأكيد الطلب عبر واتساب
        </button>

    </div>

</div>

{

const DELIVERY_FEE = 15;
const FREE_SHIPPING_LIMIT = 100;
const COUPON_CODE = "NEXO50";
const COUPON_RATE = 0.50;
const WHATSAPP = "966501203710";


let cart =
    JSON.parse(
        localStorage.getItem("nexo_cart") || "[]"
    );

let category = "الكل";
let couponApplied = false;
let deliveryMethod = "delivery";
let currentProduct = null;


/* =========================
   PRODUCTS
========================= */

function renderProducts(){

    const box =
        document.getElementById("products");

    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const filtered =
        products.filter(product => {

            const categoryOK =
                category === "الكل" ||
                product.category === category;

            const searchOK =
                product.name
                .toLowerCase()
                .includes(search)
                ||
                product.desc
                .toLowerCase()
                .includes(search);

            return categoryOK && searchOK;

        });


    if(filtered.length === 0){

        box.innerHTML = `
            <div class="empty">
                لا توجد منتجات
            </div>
        `;

        return;

    }


    box.innerHTML =
        filtered.map(product => `

            <div
                class="product"
                onclick="openProduct('${product.id}')"
            >

                <img
                    class="productImg"
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                >

                <div class="productBody">

                    <div class="productName">
                        ${product.name}
                    </div>

                    <div class="productDescription">
                        ${product.desc}
                    </div>

                    <div class="oldPrice">
                        ${product.oldPrice} ريال
                    </div>

                    <div class="price">
                        ${product.price} ريال
                    </div>

                    <button
                        class="addButton"
                        onclick="event.stopPropagation();addToCart('${product.id}')"
                    >
                        أضف للسلة
                    </button>

                </div>

            </div>

        `).join("");

}


/* =========================

function openProduct(id){

    const product =

    if(!product) return;

    currentProduct = product;

    document.getElementById("detailImage").src =

    document.getElementById("detailImage").alt =

    document.getElementById("detailName").textContent =

    document.getElementById("detailDescription").textContent =

    document.getElementById("detailOldPrice").textContent =

    document.getElementById("detailPrice").textContent =

    document.getElementById("detailAddButton").onclick =

            addToCart(product.id);

        };


    const page =
        document.getElementById("productPage");

    page.classList.add("show");

    document.body.style.overflow = "hidden";

    history.pushState(
        {
            product:true,
            id:product.id
        },
        "",
        "#product-" + product.id

}


function closeProductPage(fromPopState=false){

    const page =
        document.getElementById("productPage");

    page.classList.remove("show");

    document.body.style.overflow = "";

    if(
        !fromPopState &&
        location.hash.startsWith("#product-")
    ){

        history.back();

    }

}

/* =========================
   CART
========================= */

function saveCart(){

    localStorage.setItem(
        "nexo_cart",
        JSON.stringify(cart)
    );

    updateCartNumber();

}


function updateCartNumber(){

    const number =
        cart.reduce(
            (sum,item) =>
                sum + item.qty,
            0
        );

    document
        .getElementById("cartNumber")
        .textContent = number;

}


function addToCart(id){

    const item =
        cart.find(x => x.id === id);


    if(item){

        item.qty++;

    }else{

        cart.push({
            id:id,
            qty:1
        });

    }


    saveCart();

}


function changeQuantity(id,amount){

    const item =
        cart.find(x => x.id === id);

    if(!item) return;


    item.qty += amount;


    if(item.qty <= 0){

        cart =
            cart.filter(
                x => x.id !== id
            );

    }


    saveCart();

    renderCart();

}


function removeItem(id){

    cart =
        cart.filter(
            x => x.id !== id
        );

    saveCart();

    renderCart();

}


/* =========================
   CALCULATE
========================= */

function calculate(){

    let originalSubtotal = 0;
    let currentSubtotal = 0;


    cart.forEach(item => {

        const product =
            products.find(
                x => x.id === item.id
            );

        if(!product) return;


        originalSubtotal +=
            product.oldPrice * item.qty;

        currentSubtotal +=
            product.price * item.qty;

    });


    let discount = 0;
    let productsTotal =
        currentSubtotal;


    if(couponApplied){

        cart.forEach(item => {

            const product =
                products.find(
                    x => x.id === item.id
                );

            if(!product) return;


            discount +=
                product.oldPrice *
                COUPON_RATE *
                item.qty;

        });


        productsTotal =
            originalSubtotal -
            discount;

    }


    const delivery =
        deliveryMethod === "pickup"
            ? 0
            : (
                currentSubtotal >=
                FREE_SHIPPING_LIMIT
                    ? 0
                    : DELIVERY_FEE
            );


    return {

        originalSubtotal,
        currentSubtotal,
        discount,
        productsTotal,
        delivery,
        total:
            productsTotal +
            delivery

    };

}

                <strong>
                    ${data.total} ريال
                </strong>
            </div>

        `;

    }else{

        summary.innerHTML = `

            <div class="summaryRow">
                <span>
                    المجموع الفرعي (للمنتجات)
                </span>

                <strong>
                    ${data.currentSubtotal} ريال
                </strong>
            </div>

            <div class="summaryRow">
                <span>
                    رسوم التوصيل (مكة)
                </span>

                <strong>
                    ${data.delivery} ريال
                </strong>

                    الإجمالي النهائي
                </span>

function applyCoupon(){

    const code =
        document
        .getElementById(
            "couponInput"
        )
        .value
        .trim()
        .toUpperCase();


    const message =
        document.getElementById(
            "couponMessage"
        );


    if(code === COUPON_CODE){

        couponApplied = true;

        message.className =
            "couponMessage success";

        message.textContent =
            "✓ تم تطبيق خصم 50% على المنتجات فقط";

        renderCart();

    }else{

        couponApplied = false;

        message.className =
            "couponMessage error";

        message.textContent =
            "✕ رمز الخصم غير صحيح";

        renderCart();

    }

}

/* =========================
   SEND ORDER
========================= */

function sendOrder(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const address =
        document
        .getElementById("address")
        .value
        .trim();


    const payment =
        document
        .getElementById("payment")
        .value;


    if(!name){

        alert("اكتب اسمك");

        return;

    }


    if(!phone){

        alert("اكتب رقم الجوال");

        return;

    }


    if(
        deliveryMethod === "delivery" &&
        !address
    ){

        alert("اكتب عنوان التوصيل");

        return;

    }


    const data =
        calculate();


    let items = "";


    cart.forEach(item => {

        const product =
            products.find(
                x => x.id === item.id
            );

        if(!product) return;


        const unitPrice =
            couponApplied
                ? product.oldPrice *
                    (1 - COUPON_RATE)
                : product.price;


        items +=
            `• ${product.name} × ${item.qty} = ${
                unitPrice * item.qty
            } ريال\n`;

    });


    const orderId =
        "NEXO-" +
        Date.now()
        .toString()
        .slice(-8);


    const order = {

        orderId,

        customerName:name,

        phone,

        address,

        deliveryMethod:
            deliveryMethod === "delivery"
                ? "توصيل"
                : "استلام من الفرع",

        paymentMethod:payment,

        items:cart,

        subtotal:
            couponApplied
                ? data.originalSubtotal
                : data.currentSubtotal,

        discount:data.discount,

        deliveryFee:data.delivery,

        total:data.total,

        status:"جديد",

        createdAt:
            new Date().toISOString()

    };


    const orders =
        JSON.parse(
            localStorage.getItem(
                "nexo_orders"
            ) || "[]"
        );


    orders.push(order);


    localStorage.setItem(
        "nexo_orders",
        JSON.stringify(orders)
    );


    let message =
`🛒 *طلب جديد - NEXO STORE*

رقم الطلب: ${orderId}

👤 الاسم: ${name}
📱 الجوال: ${phone}

📦 المنتجات:
${items}
`;


    if(couponApplied){

        message +=
`💰 المجموع الأصلي للمنتجات: ${data.originalSubtotal} ريال
🏷️️ خصم 50%: ${data.discount} ريال
💵 المنتجات بعد الخصم: ${data.productsTotal} ريال
`;

    }else{

        message +=
`💰 مجموع المنتجات: ${data.productsTotal} ريال
`;

    }


    message +=
`🚚 رسوم التوصيل: ${data.delivery} ريال
💳 طريقة الدفع: ${payment}
📦 طريقة الاستلام: ${
    deliveryMethod === "delivery"
        ? "توصيل"
        : "استلام من الفرع"
}

💵 *الإجمالي النهائي: ${data.total} ريال*
`;


    if(deliveryMethod === "delivery"){

        message +=
`\n📍 العنوان:
${address}`;

    }


    const url =
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(message);


    cart = [];

    saveCart();


    window.open(
        url,
        "_blank"
    );


    closeModal(
        "orderModal"
    );

}
