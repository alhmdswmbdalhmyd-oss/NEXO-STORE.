<title>NEXO STORE</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:"Cairo",sans-serif;
    background:#f5f7fa;

}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}

header{
    background:#fff;
    height:110px;
    display:flex;
    align-items:center;

    padding:0 28px;

    top:0;

}

.logo{

}

.cartButton{

    border-radius:25px;
    background:#075db4;
    font-size:38px;
    position:relative;
}

.cartNumber{
    position:absolute;
    top:-5px;
    right:-5px;
    width:35px;
    height:35px;
    background:#b5202a;
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:800;
    border:3px solid #fff;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:22px 15px 60px;
}

.deliveryBanner{
    background:#eaf5ff;

}

.search{

    background:#fff;

}

.categories{
    display:flex;

    overflow-x:auto;

    margin-bottom:18px;
}

.category{
    white-space:nowrap;
    border:0;
    background:#fff;
    border-radius:14px;
    padding:10px 17px;
    font-weight:700;

}

.category.active{

.products{
    display:grid;

}

.product{

}

.productImg{

.productBody{

.productName{

}

.productDescription{

.oldPrice{

.price{

}

.addButton{
    width:100%;
    height:48px;
    border:0;
    border-radius:14px;
    background:#0876d9;
    color:#fff;
    font-size:16px;
    font-weight:800;
    margin-top:10px;
}

.modalBackground{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);

    align-items:center;
    justify-content:center;
    padding:10px;

.modalBackground.show{

}

.modal{
    width:100%;
    max-width:650px;

    background:#fff;

}

.closeButton{

.coupon input{

}

.coupon button{

}

.couponMessage{

.error{

}

.checkout{

    border:0;
    border-radius:17px;
    background:#0876d9;
    color:#fff;
    font-size:19px;
    font-weight:800;
    margin-top:17px;
}

.formGroup{
    margin-bottom:14px;
}

.formGroup label{
    display:block;
    font-weight:800;
    margin-bottom:6px;
}

.formGroup input,
.formGroup textarea,
.formGroup select{
    width:100%;
    border:1px solid #d7dce2;
    border-radius:14px;
    padding:12px;
    font-size:16px;
    outline:none;
    background:#fff;
}

.formGroup input,
.formGroup select{
    height:53px;
}

.formGroup textarea{
    height:100px;
    resize:none;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.option{
    border:2px solid #e0e3e7;
    border-radius:15px;
    padding:12px;
    text-align:center;
    font-weight:700;
}

.option.active{

.empty{

.loader{

    background:#fff;

.loader.hide{

.loaderCircle{
    width:55px;
    height:55px;

.loaderText{
    color:#0876d9;
    font-size:18px;
    font-weight:800;
    margin-top:15px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:900px){
    .products{

@media(max-width:650px){
    header{

    }

    }

    }

    }

    .productBody{

    }

        min-height:50px;
    }

    .productDescription{

    }

    .price{
        font-size:20px;
    }

    .addButton{
        height:44px;
        font-size:14px;
    }

    .deliveryBanner{
        font-size:17px;
    }

    .modal{
        padding:22px 16px;
    }
}
</style>
</head>

<body>

<div class="loader" id="loader">
    <div class="loaderCircle"></div>
    <div class="loaderText">جاري تجهيز المتجر...</div>
</div>

<header>
    <button class="cartButton" onclick="openCart()">
        🛒
        <span class="cartNumber" id="cartNumber">0</span>
    </button>

    <div class="logo">NEXO STORE</div>
</header>

<div class="container">

    <div class="deliveryBanner">
        🚚 التوصيل فقط داخل مكة
    </div>

    <input
        id="search"
        class="search"
        type="text"
        placeholder="ابحث عن منتج..."
        oninput="renderProducts()"
    >

    <div class="categories">
        <button class="category active" onclick="selectCategory('الكل',this)">الكل</button>
        <button class="category" onclick="selectCategory('شواحن',this)">شواحن</button>
        <button class="category" onclick="selectCategory('كيابل',this)">كيابل</button>
        <button class="category" onclick="selectCategory('سماعات',this)">سماعات</button>
        <button class="category" onclick="selectCategory('سيارات',this)">سيارات</button>
        <button class="category" onclick="selectCategory('متنوع',this)">متنوع</button>
    </div>

    <div class="products" id="products"></div>

</div>


<!-- السلة -->

<div class="modalBackground" id="cartModal">

    <div class="modal">

        <button class="closeButton" onclick="closeModal('cartModal')">×</button>

        <div class="modalTitle">
            🛒 سلة المشتريات
        </div>

        <div id="cartItems"></div>

        <div id="emptyCart" class="empty" style="display:none">
            السلة فارغة
        </div>

        <div id="cartContent">

            <div id="freeShipping" class="freeShipping"></div>

            <div id="summary"></div>

            <div class="coupon">

                <input
                    id="couponInput"
                    type="text"
                    placeholder="NEXO50"
                    autocomplete="off"
                >

                <button onclick="applyCoupon()">
                    تطبيق
                </button>

            </div>

            <div id="couponMessage" class="couponMessage"></div>

            <button class="checkout" onclick="openOrder()">
                إتمام الطلب
            </button>

        </div>

    </div>

</div>


<!-- الطلب -->

<div class="modalBackground" id="orderModal">

    <div class="modal">

        <button class="closeButton" onclick="closeModal('orderModal')">×</button>

        <div class="modalTitle">
            إتمام الطلب
        </div>

        <div class="formGroup">
            <label>الاسم</label>
            <input id="name" type="text" placeholder="اكتب اسمك">
        </div>

        <div class="formGroup">
            <label>رقم الجوال</label>
            <input id="phone" type="tel" placeholder="05xxxxxxxx">
        </div>

        <div class="formGroup">
            <label>العنوان</label>
            <textarea id="address" placeholder="اكتب عنوان التوصيل داخل مكة"></textarea>
        </div>

        <div class="formGroup">

            <label>طريقة الاستلام</label>

            <div class="options">

                <div
                    id="deliveryOption"
                    class="option active"
                    onclick="setDelivery('delivery')"
                >
                    🚚 توصيل
                    <br>
                    <small>15 ريال</small>
                </div>

                <div
                    id="pickupOption"
                    class="option"
                    onclick="setDelivery('pickup')"
                >
                    🏪 استلام من الفرع
                    <br>
                    <small>مجاناً</small>
                </div>

            </div>

        </div>

        <div class="formGroup">

            <label>طريقة الدفع</label>

            <select id="payment">
                <option>دفع عند الاستلام</option>
                <option>تحويل بنكي</option>
            </select>

        </div>

        <div id="orderSummary"></div>

        <button class="checkout" onclick="sendOrder()">
            تأكيد الطلب عبر واتساب
        </button>

    </div>

</div>


<script>

/* =========================

const products = [

{

    desc:"شاحن جداري بمنفذين للشحن."
},

{

    name:"PROMASS PM-8509 - شاحن PD+QC 38W",
    oldPrice:30,

    desc:"شاحن سريع بتقنية PD وQC بقوة 38W."
},

{

    oldPrice:30,
    price:15,
    category:"سيارات",

    desc:"حامل مغناطيسي صغير وعملي للسيارة."
}

];


/* =========================
   الإعدادات
========================= */

const DELIVERY_FEE = 15;
const FREE_SHIPPING_LIMIT = 100;
const COUPON_CODE = "NEXO50";
const COUPON_RATE = 0.50;
const WHATSAPP = "966501203710";

let cart = JSON.parse(localStorage.getItem("nexo_cart") || "[]");

let category = "الكل";

let couponApplied = false;

let deliveryMethod = "delivery";


/* =========================
   المنتجات
========================= */

function renderProducts(){

    const box = document.getElementById("products");

    const search =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();

    const filtered = products.filter(product => {

        const categoryOK =
            category === "الكل" ||
            product.category === category;

        const searchOK =
            product.name.toLowerCase().includes(search) ||
            product.desc.toLowerCase().includes(search);

        return categoryOK && searchOK;

    });


    if(filtered.length === 0){

        box.innerHTML = `
            <div class="empty">
                لا توجد منتجات
            </div>
        `;

        return;
    }


    box.innerHTML = filtered.map(product => `

        <div class="product">

            <img
                class="productImg"
                src="${product.image}"
                alt="${product.name}"
            >

            <div class="productBody">

                <div class="productName">
                    ${product.name}
                </div>

                <div class="productDescription">
                    ${product.desc}
                </div>

                <div class="oldPrice">
                    ${product.oldPrice} ريال
                </div>

                <div class="price">
                    ${product.price} ريال
                </div>

                <button
                    class="addButton"
                    onclick="addToCart('${product.id}')"
                >
                    أضف للسلة
                </button>

            </div>

        </div>

    `).join("");

}


/* =========================
   التصنيفات
========================= */

function selectCategory(value,button){

    category = value;

    document
        .querySelectorAll(".category")
        .forEach(x => x.classList.remove("active"));

    button.classList.add("active");

    renderProducts();
}


/* =========================
   السلة
========================= */

function saveCart(){

    localStorage.setItem(
        "nexo_cart",
        JSON.stringify(cart)
    );

    updateCartNumber();
}


function updateCartNumber(){

    const number =
        cart.reduce(
            (sum,item) => sum + item.qty,
            0
        );

    document.getElementById("cartNumber").textContent =
        number;
}


function addToCart(id){

    const item =
        cart.find(x => x.id === id);

    if(item){

        item.qty++;

    }else{

        cart.push({
            id:id,
            qty:1
        });

    }

    saveCart();

    alert("تمت إضافة المنتج إلى السلة");
}


function changeQuantity(id,amount){

    const item =
        cart.find(x => x.id === id);

    if(!item) return;

    item.qty += amount;

    if(item.qty <= 0){

        cart =
            cart.filter(x => x.id !== id);

    }

    saveCart();

    renderCart();
}


function removeItem(id){

    cart =
        cart.filter(x => x.id !== id);

    saveCart();

    renderCart();
}


/* =========================
   حساب الأسعار
========================= */

function calculate(){

    let originalSubtotal = 0;

    let currentSubtotal = 0;


    cart.forEach(item => {

        const product =
            products.find(x => x.id === item.id);

        if(!product) return;

        originalSubtotal +=
            product.oldPrice * item.qty;

        currentSubtotal +=
            product.price * item.qty;

    });


    /*
      بدون الكوبون:
      نستخدم السعر الحالي الموجود في المتجر.
    */

    if(!couponApplied){

        const delivery =
            deliveryMethod === "pickup"
                ? 0
                : (
                    currentSubtotal >= FREE_SHIPPING_LIMIT
                        ? 0
                        : DELIVERY_FEE
                );

        return {
            originalSubtotal,
            currentSubtotal,
            discount:0,
            productsTotal:currentSubtotal,
            delivery,
            total:currentSubtotal + delivery
        };
    }


    /*
      الكوبون NEXO50

      مهم:

      الخصم يحسب من oldPrice

      30 × 50% = 15 خصم
      20 × 50% = 10 خصم
      10 × 50% = 5 خصم

      ثم:
      السعر الأصلي - الخصم

      ولا يتم خصم التوصيل.
    */

    let discount = 0;


    cart.forEach(item => {

        const product =
            products.find(x => x.id === item.id);

        if(!product) return;

        discount +=
            product.oldPrice *
            COUPON_RATE *
            item.qty;

    });


    const productsTotal =
        originalSubtotal - discount;


    const delivery =
        deliveryMethod === "pickup"
            ? 0
            : (
                currentSubtotal >= FREE_SHIPPING_LIMIT
                    ? 0
                    : DELIVERY_FEE
            );


    return {
        originalSubtotal,
        currentSubtotal,
        discount,
        productsTotal,
        delivery,
        total:productsTotal + delivery
    };

}

function renderCart(){

    const itemsBox =
        document.getElementById("cartItems");

    const empty =
        document.getElementById("emptyCart");

    const content =
        document.getElementById("cartContent");


    if(cart.length === 0){

        itemsBox.innerHTML = "";

        empty.style.display = "block";

        content.style.display = "none";

        return;

    }


    empty.style.display = "none";

    content.style.display = "block";


    itemsBox.innerHTML =
        cart.map(item => {

            const product =
                products.find(x => x.id === item.id);

            if(!product) return "";


            return `

                <div class="cartItem">

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    <div class="cartInfo">

                        <div class="cartName">
                            ${product.name}
                        </div>

                        <div class="cartPrice">
                            ${product.price} ريال
                        </div>

                        <div class="quantity">

                            <button
                                onclick="changeQuantity('${product.id}',1)"
                            >
                                +
                            </button>

                            <span>
                                ${item.qty}
                            </span>

                            <button
                                onclick="changeQuantity('${product.id}',-1)"
                            >
                                −
                            </button>

                        </div>

                    </div>

                    <button
                        class="delete"
                        onclick="removeItem('${product.id}')"
                    >
                        🗑
                    </button>

                </div>

            `;

        }).join("");


    const data = calculate();


    const freeShipping =
        document.getElementById("freeShipping");


    if(deliveryMethod === "pickup"){

        freeShipping.textContent =
            "🏪 الاستلام من الفرع مجاني";

    }
    else if(data.currentSubtotal >= FREE_SHIPPING_LIMIT){

        freeShipping.textContent =
            "🎉 حصلت على التوصيل المجاني";

    }
    else{

        freeShipping.textContent =
            `أضف ${FREE_SHIPPING_LIMIT - data.currentSubtotal} ريال إضافية للحصول على توصيل مجاني!`;

    }


    const summary =
        document.getElementById("summary");


    if(couponApplied){

        summary.innerHTML = `

            <div class="summaryRow">
                <span>المجموع الأصلي للمنتجات</span>
                <strong>${data.originalSubtotal} ريال</strong>
            </div>

            <div class="summaryRow discountRow">
                <span>الخصم 50%</span>
                <strong>− ${data.discount} ريال</strong>
            </div>

            <div class="summaryRow">
                <span>المنتجات بعد الخصم</span>
                <strong>${data.productsTotal} ريال</strong>
            </div>

            <div class="summaryRow">
                <span>رسوم التوصيل (مكة)</span>
                <strong>${data.delivery} ريال</strong>
            </div>

            <div class="summaryRow totalRow">
                <span>الإجمالي النهائي</span>
                <strong>${data.total} ريال</strong>
            </div>

        `;

    }else{

        summary.innerHTML = `

            <div class="summaryRow">
                <span>المجموع الفرعي (للمنتجات)</span>
                <strong>${data.currentSubtotal} ريال</strong>
            </div>

            <div class="summaryRow">
                <span>رسوم التوصيل (مكة)</span>
                <strong>${data.delivery} ريال</strong>
            </div>

            <div class="summaryRow totalRow">
                <span>الإجمالي النهائي</span>
                <strong>${data.total} ريال</strong>
            </div>

        `;

    }


    const message =
        document.getElementById("couponMessage");


    if(couponApplied){

        message.className =
            "couponMessage success";

        message.textContent =
            "✓ تم تطبيق خصم 50% على المنتجات فقط";

    }else{

        message.className =
            "couponMessage";

        message.textContent = "";

    }

}


/* =========================
   تطبيق الكوبون
========================= */

function applyCoupon(){

    const code =
        document
        .getElementById("couponInput")
        .value
        .trim()
        .toUpperCase();


    const message =
        document.getElementById("couponMessage");


    if(code === COUPON_CODE){

        couponApplied = true;

        message.className =
            "couponMessage success";

        message.textContent =
            "✓ تم تطبيق خصم 50% على المنتجات فقط";

        renderCart();

    }else{

        couponApplied = false;

        message.className =
            "couponMessage error";

        message.textContent =
            "✕ رمز الخصم غير صحيح";

        renderCart();

    }

}

/* =========================
   إرسال الطلب
========================= */

function sendOrder(){

    const name =
        document.getElementById("name")
        .value
        .trim();

    const phone =
        document.getElementById("phone")
        .value
        .trim();

    const address =
        document.getElementById("address")
        .value
        .trim();

    const payment =
        document.getElementById("payment")
        .value;


    if(!name){

        alert("اكتب اسمك");

        return;
    }


    if(!phone){

        alert("اكتب رقم الجوال");

        return;
    }


    if(
        deliveryMethod === "delivery" &&
        !address
    ){

        alert("اكتب عنوان التوصيل");

        return;
    }


    const data = calculate();


    let items = "";


    cart.forEach(item => {

        const product =
            products.find(x => x.id === item.id);

        if(!product) return;


        /*
          إذا كان الكوبون مفعلاً:
          سعر الوحدة بعد الخصم يحسب من oldPrice.

          30 → 15
          20 → 10
          10 → 5
        */

        const unitPrice =
            couponApplied
                ? product.oldPrice -
                  (product.oldPrice * COUPON_RATE)
                : product.price;


        items +=
            `• ${product.name} × ${item.qty} = ${unitPrice * item.qty} ريال\n`;

    });


    const orderId =
        "NEXO-" +
        Date.now()
        .toString()
        .slice(-8);


    const order = {

        orderId,

        customerName:name,

        phone,

        address,

        deliveryMethod:
            deliveryMethod === "delivery"
                ? "توصيل"
                : "استلام من الفرع",

        paymentMethod:payment,

        items:cart,

        subtotal:
            couponApplied
                ? data.originalSubtotal
                : data.currentSubtotal,

        discount:data.discount,

        deliveryFee:data.delivery,

        total:data.total,

        status:"جديد",

        createdAt:
            new Date().toISOString()

    };


    const orders =
        JSON.parse(
            localStorage.getItem("nexo_orders") || "[]"
        );


    orders.push(order);


    localStorage.setItem(
        "nexo_orders",
        JSON.stringify(orders)
    );


    let message =
`🛒 *طلب جديد - NEXO STORE*

رقم الطلب: ${orderId}

👤 الاسم: ${name}
📱 الجوال: ${phone}

📦 المنتجات:
${items}
`;


    if(couponApplied){

        message +=
`💰 المجموع الأصلي للمنتجات: ${data.originalSubtotal} ريال
🏷️ خصم 50%: ${data.discount} ريال
💵 المنتجات بعد الخصم: ${data.productsTotal} ريال
`;

    }else{

        message +=
`💰 مجموع المنتجات: ${data.productsTotal} ريال
`;

    }


    message +=
`🚚 رسوم التوصيل: ${data.delivery} ريال
💳 طريقة الدفع: ${payment}
📦 طريقة الاستلام: ${
    deliveryMethod === "delivery"
        ? "توصيل"
        : "استلام من الفرع"
}

💵 *الإجمالي النهائي: ${data.total} ريال*
`;


    if(deliveryMethod === "delivery"){

        message +=
`\n📍 العنوان:
${address}`;

    }


    const url =
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(message);


    cart = [];

    saveCart();


    window.open(
        url,
        "_blank"
    );


    closeModal("orderModal");

}
