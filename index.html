<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXO STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Cairo,sans-serif;
background:#fff;
color:#111;
}
button,input{font-family:inherit}
button{cursor:pointer}

#splash{
position:fixed;
inset:0;
background:#fff;
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
font-weight:800;
}
#splash.hide{
opacity:0;
visibility:hidden;
transition:.5s;
}

header{
position:sticky;
top:0;
z-index:100;
background:#fff;
border-bottom:1px solid #eee;
padding:12px 15px;
}

.headerTop{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
max-width:1200px;
margin:auto;
}

.logo{
font-size:25px;
font-weight:800;
letter-spacing:.5px;
}

.cartBtn{
border:0;
background:#111;
color:#fff;
border-radius:13px;
padding:10px 14px;
font-weight:700;
position:relative;
}

#cartCount{
position:absolute;
top:-7px;
left:-7px;
background:#e53935;
color:#fff;
width:21px;
height:21px;
border-radius:50%;
font-size:12px;
display:flex;
align-items:center;
justify-content:center;
}

.searchBox{
max-width:700px;
margin:13px auto 0;
}

.searchBox input{
width:100%;
border:1px solid #ddd;
border-radius:14px;
padding:13px 16px;
outline:none;
font-size:14px;
}

.categories{
display:flex;
gap:8px;
overflow:auto;
max-width:1200px;
margin:12px auto 0;
padding-bottom:2px;
}

.cat{
white-space:nowrap;
border:1px solid #ddd;
background:#fff;
border-radius:20px;
padding:8px 14px;
font-size:13px;
font-weight:700;
}

.cat.active{
background:#111;
color:#fff;
border-color:#111;
}

.deliveryBanner{
margin:15px auto;
max-width:1200px;
padding:12px;
border-radius:14px;
background:#f5f5f5;
text-align:center;
font-weight:700;
font-size:14px;
}

.container{
max-width:1200px;
margin:auto;
padding:0 15px 100px;
}

.products{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:12px;
}

.product{
border:1px solid #e7e7e7;
border-radius:15px;
overflow:hidden;
background:#fff;
min-width:0;
transition:.2s;
}

.product:hover{
box-shadow:0 7px 25px rgba(0,0,0,.07);
}

.productImg{
width:100%;
aspect-ratio:1/1;
object-fit:contain;
background:#fafafa;
display:block;
}

.productBody{
padding:10px;
}

.productName{
font-size:14px;
font-weight:800;
line-height:1.6;
min-height:45px;
}

.oldPrice{
font-size:13px;
color:#999;
text-decoration:line-through;
margin-top:5px;
}

.salePrice{
font-size:20px;
font-weight:900;
color:#111;
}

.priceRow{
display:flex;
align-items:center;
justify-content:space-between;
gap:5px;
margin-top:4px;
}

.discountBadge{
font-size:10px;
font-weight:800;
background:#111;
color:#fff;
padding:4px 7px;
border-radius:7px;
}

.addBtn{
width:100%;
border:0;
background:#111;
color:#fff;
border-radius:10px;
padding:10px 7px;
margin-top:9px;
font-weight:800;
font-size:13px;
}

.stock{
font-size:11px;
color:#777;
margin-top:5px;
}

.empty{
text-align:center;
padding:50px 10px;
color:#777;
display:none;
}

#cartModal,
#productModal,
#orderModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:500;
display:none;
align-items:flex-end;
justify-content:center;
}

.modalBox{
background:#fff;
width:100%;
max-width:650px;
max-height:90vh;
overflow:auto;
border-radius:22px 22px 0 0;
padding:18px;
}

.modalHead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.close{
border:0;
background:#f1f1f1;
width:35px;
height:35px;
border-radius:50%;
font-size:20px;
}

.detailImage{
width:100%;
max-height:320px;
object-fit:contain;
background:#fafafa;
border-radius:15px;
}

.detailName{
font-size:21px;
font-weight:900;
margin:15px 0 5px;
}

.detailDescription{
font-size:14px;
color:#666;
line-height:1.8;
}

.optionGroup{
margin-top:15px;
}

.optionTitle{
font-weight:800;
margin-bottom:7px;
}

.options{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.option{
border:1px solid #ddd;
background:#fff;
padding:8px 12px;
border-radius:9px;
font-weight:700;
}

.option.active{
background:#111;
color:#fff;
border-color:#111;
}

.qty{
display:flex;
align-items:center;
gap:10px;
margin:15px 0;
}

.qty button{
width:36px;
height:36px;
border:0;
border-radius:9px;
background:#eee;
font-size:20px;
}

.qty span{
font-size:18px;
font-weight:800;
min-width:25px;
text-align:center;
}

.primary{
width:100%;
border:0;
background:#111;
color:#fff;
padding:13px;
border-radius:12px;
font-weight:800;
font-size:15px;
}

.cartItem{
display:flex;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid #eee;
}

.cartItem img{
width:65px;
height:65px;
object-fit:contain;
background:#fafafa;
border-radius:10px;
}

.cartItemInfo{
flex:1;
}

.cartItemName{
font-weight:800;
font-size:13px;
line-height:1.5;
}

.cartItemPrice{
font-size:13px;
margin-top:4px;
}

.cartQty{
display:flex;
align-items:center;
gap:6px;
margin-top:5px;
}

.cartQty button{
border:0;
background:#eee;
width:27px;
height:27px;
border-radius:7px;
}

.removeBtn{
border:0;
background:#ffe9e9;
color:#c00;
padding:7px;
border-radius:8px;
font-size:11px;
}

.totalBox{
margin-top:15px;
padding:15px;
border-radius:13px;
background:#f7f7f7;
}

.totalLine{
display:flex;
justify-content:space-between;
margin:7px 0;
font-size:14px;
}

.totalLine.final{
font-size:19px;
font-weight:900;
border-top:1px solid #ddd;
padding-top:10px;
margin-top:12px;
}

.field{
margin-bottom:12px;
}

.field label{
display:block;
font-size:13px;
font-weight:800;
margin-bottom:5px;
}

.field input,
.field textarea,
.field select{
width:100%;
border:1px solid #ddd;
border-radius:11px;
padding:11px;
outline:none;
font-size:14px;
background:#fff;
}

.field textarea{
min-height:80px;
resize:vertical;
}

.paymentMethods{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

.payment{
border:1px solid #ddd;
background:#fff;
padding:10px 5px;
border-radius:10px;
font-size:12px;
font-weight:800;
}

.payment.active{
background:#111;
color:#fff;
}

.couponBox{
display:flex;
gap:7px;
margin-top:12px;
}

.couponBox input{
flex:1;
border:1px solid #ddd;
border-radius:10px;
padding:11px;
outline:none;
}

.couponBox button{
border:0;
background:#111;
color:#fff;
border-radius:10px;
padding:0 15px;
font-weight:800;
}

.couponMessage{
font-size:12px;
font-weight:700;
margin-top:6px;
}

.floatCart{
position:fixed;
bottom:18px;
left:18px;
right:18px;
max-width:500px;
margin:auto;
z-index:150;
}

.floatCart button{
width:100%;
border:0;
background:#111;
color:#fff;
padding:14px;
border-radius:15px;
font-weight:900;
font-size:15px;
box-shadow:0 8px 25px rgba(0,0,0,.18);
}

@media(max-width:900px){
.products{
grid-template-columns:repeat(3,minmax(0,1fr));
}
}

@media(max-width:650px){
.products{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:9px;
}

.productBody{
padding:8px;
}

.productName{
font-size:12px;
min-height:42px;
}

.salePrice{
font-size:17px;
}

.oldPrice{
font-size:11px;
}

.addBtn{
font-size:12px;
padding:9px 5px;
}

.discountBadge{
font-size:9px;
}

.paymentMethods{
grid-template-columns:1fr;
}
}

@media(max-width:370px){
.products{
grid-template-columns:1fr 1fr;
gap:7px;
}
}
</style>
</head>

<body>

<div id="splash">جاري تجهيز المتجر...</div>

<header>

<div id="productModal">

</div>

<div id="orderModal">

<div class="modalHead">

},

{

}

];

let cart=JSON.parse(localStorage.getItem("nexo_cart")||"[]");
let selectedCategory="الكل";
let selectedProduct=null;
let selectedOption=null;
let productQty=1;
let appliedCoupon=false;

function saveCart(){
localStorage.setItem("nexo_cart",JSON.stringify(cart));
updateCartCount();
}

function updateCartCount(){
const count=cart.reduce((sum,item)=>sum+item.qty,0);
document.getElementById("cartCount").textContent=count;
}

function renderCategories(){

const box=document.getElementById("categories");

box.innerHTML=CATS.map(cat=>`
<button class="cat ${cat===selectedCategory?"active":""}"
onclick="selectCategory('${cat}')">
${cat}
</button>
`).join("");

}

function selectCategory(cat){
selectedCategory=cat;
renderCategories();
renderProducts();
}

function renderProducts(){

const search=document.getElementById("searchInput").value.trim().toLowerCase();

const list=products.filter(p=>{

const matchCategory=
selectedCategory==="الكل" ||
p.category===selectedCategory;

const matchSearch=
p.name.toLowerCase().includes(search);

return matchCategory&&matchSearch;

});

const box=document.getElementById("products");
const empty=document.getElementById("empty");

if(!list.length){
box.innerHTML="";
empty.style.display="block";
return;
}

empty.style.display="none";

box.innerHTML=list.map(p=>{

const finalPrice=getDisplayedPrice(p);

return `
<div class="product">

<img
class="productImg"
src="${p.image}"
alt="${escapeHtml(p.name)}"
onclick="openProduct('${p.id}')"
onerror="this.style.opacity='.2'"
>

<div class="productBody">

<div class="productName">
${escapeHtml(p.name)}
</div>

<div class="oldPrice">
${p.marketPrice} ر.س
</div>

<div class="priceRow">

<div class="salePrice">
${finalPrice} ر.س
</div>

<div class="discountBadge">
${DISCOUNT_PERCENT}% خصم
</div>

</div>

<div class="stock">
المتوفر: ${p.quantity}
</div>

<button class="addBtn" onclick="openProduct('${p.id}')">
اختيار المنتج
</button>

</div>
</div>
`;

}).join("");

}

function getDisplayedPrice(product){

if(appliedCoupon){
return Math.round(product.marketPrice*(1-DISCOUNT_PERCENT/100));
}

return product.marketPrice;

}

function openProduct(id){

selectedProduct=products.find(p=>p.id===id);
selectedOption=null;
productQty=1;

if(selectedProduct.options){
selectedOption=selectedProduct.options[0];
}

renderProductDetails();

document.getElementById("productModal").style.display="flex";

}

function renderProductDetails(){

const p=selectedProduct;

let currentPrice=selectedOption
?selectedOption.price
:p.price;

if(appliedCoupon){
currentPrice=Math.round(
(selectedOption?selectedOption.marketPrice:p.marketPrice)
*(1-DISCOUNT_PERCENT/100)
);
}

const image=selectedOption
?selectedOption.image
:p.image;

let optionsHTML="";

if(p.options){

optionsHTML=`
<div class="optionGroup">
<div class="optionTitle">اختر النوع:</div>

<div class="options">

${p.options.map((o,i)=>`

<button
class="option ${selectedOption===o?"active":""}"
onclick="chooseOption(${i})">
${o.name}
</button>

`).join("")}

</div>
</div>
`;

}

document.getElementById("productDetails").innerHTML=`

<img class="detailImage" src="${image}">

<div class="detailName">
${escapeHtml(p.name)}
</div>

<div class="detailDescription">
${escapeHtml(p.description)}
</div>

${optionsHTML}

<div class="priceRow" style="margin-top:15px">

<div>
<div class="oldPrice">
${selectedOption?selectedOption.marketPrice:p.marketPrice} ر.س
</div>

<div class="salePrice">
${currentPrice} ر.س
</div>
</div>

<div class="discountBadge">
${DISCOUNT_PERCENT}% خصم
</div>

</div>

<div class="qty">

<button onclick="changeProductQty(-1)">−</button>

<span>${productQty}</span>

<button onclick="changeProductQty(1)">+</button>

</div>

<button class="primary" onclick="addSelectedToCart()">
أضف للسلة
</button>

`;

}

function chooseOption(index){

selectedOption=selectedProduct.options[index];

productQty=1;

renderProductDetails();

}

function changeProductQty(change){

const max=selectedOption
?selectedOption.quantity
:selectedProduct.quantity;

productQty+=change;

if(productQty<1)productQty=1;
if(productQty>max)productQty=max;

renderProductDetails();

}

function addSelectedToCart(){

const p=selectedProduct;
const option=selectedOption;

const key=p.id+(option?":"+option.name:"");

const found=cart.find(x=>x.key===key);

const stock=option?option.quantity:p.quantity;

if(found){

if(found.qty+productQty>stock){
alert("الكمية المطلوبة غير متوفرة");
return;
}

found.qty+=productQty;

}else{

cart.push({
key,
id:p.id,
name:p.name,
option:option?option.name:"",
image:option?option.image:p.image,
price:option?option.price:p.price,
marketPrice:option?option.marketPrice:p.marketPrice,
qty:productQty
});

}

saveCart();
closeModal("productModal");
openCart();

}

function openCart(){

renderCart();

document.getElementById("cartModal").style.display="flex";

}

function renderCart(){

const box=document.getElementById("cartContent");

if(!cart.length){

box.innerHTML=`
<div style="text-align:center;padding:35px 10px;color:#777">
السلة فارغة
</div>
`;

return;

}

let subtotal=0;

const itemsHTML=cart.map(item=>{

const price=appliedCoupon
?Math.round(item.marketPrice*(1-DISCOUNT_PERCENT/100))
:item.marketPrice;

subtotal+=price*item.qty;

return `

<div class="cartItem">

<img src="${item.image}">

<div class="cartItemInfo">

<div class="cartItemName">
${escapeHtml(item.name)}
${item.option?`<br><small>${escapeHtml(item.option)}</small>`:""}
</div>

<div class="cartItemPrice">
${price} ر.س × ${item.qty}
</div>

<div class="cartQty">

<button onclick="changeCartQty('${item.key}',-1)">−</button>

<span>${item.qty}</span>

<button onclick="changeCartQty('${item.key}',1)">+</button>

</div>

</div>

<button class="removeBtn" onclick="removeCartItem('${item.key}')">
حذف
</button>

</div>

`;

}).join("");

const discount=appliedCoupon
?Math.round(subtotal/(1-DISCOUNT_PERCENT/100)*DISCOUNT_PERCENT/100)
:0;

const delivery=15;

const total=subtotal+delivery;

box.innerHTML=`

${itemsHTML}

<div class="couponBox">

<input
id="couponInput"
placeholder="كود الخصم"
value="${appliedCoupon?DISCOUNT_CODE:""}"
>

<button onclick="applyCoupon()">
تطبيق
</button>

</div>

${appliedCoupon?`
<div class="couponMessage">
تم تطبيق كود الخصم
</div>
`:""}

<div class="totalBox">

<div class="totalLine">
<span>الإجمالي</span>
<strong>${subtotal} ر.س</strong>
</div>

<div class="totalLine">
<span>التوصيل</span>
<strong>${delivery} ر.س</strong>
</div>

<div class="totalLine final">
<span>المجموع</span>
<strong>${total} ر.س</strong>
</div>

</div>

<button class="primary" style="margin-top:12px"
onclick="openOrder()">
إتمام الطلب
</button>

`;

}

function applyCoupon(){

const input=document.getElementById("couponInput");

if(!input)return;

if(input.value.trim().toUpperCase()===DISCOUNT_CODE){

appliedCoupon=true;

renderProducts();
renderCart();

}else{

alert("كود الخصم غير صحيح");

}

}

function changeCartQty(key,change){

const item=cart.find(x=>x.key===key);

if(!item)return;

item.qty+=change;

if(item.qty<=0){

cart=cart.filter(x=>x.key!==key);

}

saveCart();
renderCart();

}

function removeCartItem(key){

cart=cart.filter(x=>x.key!==key);

saveCart();
renderCart();

}

function openOrder(){

if(!cart.length){
alert("السلة فارغة");
return;
}

document.getElementById("cartModal").style.display="none";

renderOrder();

document.getElementById("orderModal").style.display="flex";

}

function renderOrder(){

const subtotal=cart.reduce((sum,item)=>{

const price=appliedCoupon
?Math.round(item.marketPrice*(1-DISCOUNT_PERCENT/100))
:item.marketPrice;

return sum+(price*item.qty);

},0);

document.getElementById("orderContent").innerHTML=`

<div class="field">
<label>الاسم</label>
<input id="customerName" placeholder="اكتب اسمك">
</div>

<div class="field">
<label>رقم الجوال</label>
<input id="customerPhone" placeholder="05xxxxxxxx">
</div>

<div class="field">
<label>طريقة الاستلام</label>

<select id="deliveryMethod" onchange="updateOrderTotal()">
<option value="delivery">توصيل داخل مكة - 15 ر.س</option>
<option value="pickup">استلام</option>
</select>

</div>

<div class="field" id="addressField">
<label>العنوان</label>
<textarea id="customerAddress" placeholder="اكتب عنوان التوصيل"></textarea>
</div>

<div class="field">
<label>طريقة الدفع</label>

<div class="paymentMethods">

<button class="payment active" onclick="selectPayment(this,'الدفع عند الاستلام')">
الدفع عند الاستلام
</button>

<button class="payment" onclick="selectPayment(this,'بطاقة / شبكة')">
بطاقة / شبكة
</button>

<button class="payment" onclick="selectPayment(this,'PayPal')">
PayPal
</button>

</div>

</div>

<div id="orderTotal" class="totalBox"></div>

<button class="primary" onclick="sendOrder()">
إرسال الطلب عبر واتساب
</button>

`;

window.selectedPayment="الدفع عند الاستلام";

updateOrderTotal();

}

function selectPayment(btn,payment){

document.querySelectorAll(".payment")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

window.selectedPayment=payment;

}

function updateOrderTotal(){

const method=document.getElementById("deliveryMethod");

if(!method)return;

const delivery=method.value==="pickup"?0:DELIVERY_FEE;

const address=document.getElementById("addressField");

if(address){
address.style.display=
method.value==="pickup"?"none":"block";
}

const subtotal=cart.reduce((sum,item)=>{

const price=appliedCoupon
?Math.round(item.marketPrice*(1-DISCOUNT_PERCENT/100))
:item.marketPrice;

return sum+(price*item.qty);

},0);

const total=subtotal+delivery;

document.getElementById("orderTotal").innerHTML=`

<div class="totalLine">
<span>الإجمالي</span>
<strong>${subtotal} ر.س</strong>
</div>

<div class="totalLine">
<span>التوصيل</span>
<strong>${delivery} ر.س</strong>
</div>

<div class="totalLine final">
<span>المجموع</span>
<strong>${total} ر.س</strong>
</div>

`;

}

function sendOrder(){

const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const method=document.getElementById("deliveryMethod").value;
const address=document.getElementById("customerAddress").value.trim();

if(!name||!phone){

alert("اكتب الاسم ورقم الجوال");

return;

}

if(method==="delivery"&&!address){

alert("اكتب العنوان");

return;

}

const orderId=
"NEXO-"+Math.floor(10000000+Math.random()*90000000);

let subtotal=0;

let message=
`طلب جديد من NEXO STORE\n\n`;

message+=`رقم الطلب: ${orderId}\n`;
message+=`الاسم: ${name}\n`;
message+=`الجوال: ${phone}\n`;
message+=`طريقة الاستلام: ${
method==="pickup"?"استلام":"توصيل"
}\n`;

if(method==="delivery"){
message+=`العنوان: ${address}\n`;
}

message+=`الدفع: ${window.selectedPayment}\n\n`;
message+=`المنتجات:\n`;

cart.forEach((item,index)=>{

const price=appliedCoupon
?Math.round(item.marketPrice*(1-DISCOUNT_PERCENT/100))
:item.marketPrice;

const lineTotal=price*item.qty;

subtotal+=lineTotal;

message+=
`${index+1}. ${item.name}`+
`${item.option?" - "+item.option:""}`+
` | ${item.qty} × ${price} = ${lineTotal} ر.س\n`;

});

const delivery=method==="pickup"?0:DELIVERY_FEE;
const total=subtotal+delivery;

message+=`\nالإجمالي: ${subtotal} ر.س\n`;
message+=`التوصيل: ${delivery} ر.س\n`;
message+=`المجموع: ${total} ر.س\n`;

if(appliedCoupon){
message+=`كود الخصم: ${DISCOUNT_CODE}\n`;
}

const url=
"https://wa.me/"+WA_NUMBER+
"?text="+encodeURIComponent(message);

window.open(url,"_blank");

}

function closeModal(id){

document.getElementById(id).style.display="none";

}

function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

document.addEventListener("DOMContentLoaded",()=>{

renderCategories();
renderProducts();
updateCartCount();

setTimeout(()=>{

document.getElementById("splash").classList.add("hide");

},700);

});

</script>

</body>
</html>
