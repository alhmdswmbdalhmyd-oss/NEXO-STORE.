<!DOCTYPE html>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Cairo",sans-serif;
  background:#f5f7fb;
  color:#111827;
}

button,
input,

button{

  border:0;
}

.header{

}

.header-inner{

.logo{

.cart-btn{

.cart-count{

  top:-7px;

  background:#d92727;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;

}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px 15px 60px;

.delivery-banner{
  background:#edf6ff;

  font-size:20px;

.search{
  width:100%;
  height:55px;

  border-radius:17px;

  font-size:16px;
  margin-bottom:15px;
}

.search:focus{

}

.categories{

.category{

.category.active{
  background:#0877dc;

}

.products{

  grid-template-columns:repeat(4,1fr);

.product{

.product-image{

.product-content{

.product-title{

.product-desc{

.price-box{

  justify-content:center;

.modal{

</main>

<div class="container" id="detailView" style="display:none;"></div>


<!-- CART -->
<div class="modal-bg" id="cartModal">

      السلة فارغة

    <div id="cartSummary">

          type="text"
          placeholder="NEXO50"
          autocomplete="off"
        >
        <button onclick="applyCoupon()">تطبيق</button>
      </div>

      <div id="couponMessage" class="coupon-message"></div>

      <button
        class="checkout-btn"
        id="checkoutBtn"
        onclick="openOrder()"
      >
        إتمام الطلب
      </button>

    </div>

  </div>
</div>


<!-- ORDER -->
<div class="modal-bg" id="orderModal">
  <div class="modal">

    <button class="close" onclick="closeModal('orderModal')">×</button>

    <div class="modal-title">إتمام الطلب</div>

    <div class="form-group">
      <label>الاسم</label>
      <input id="customerName" type="text" placeholder="اكتب اسمك">
    </div>

    <div class="form-group">
      <label>رقم الجوال</label>
      <input id="customerPhone" type="tel" placeholder="05xxxxxxxx">
    </div>

    <div class="form-group">
      <label>العنوان</label>
      <textarea id="customerAddress" placeholder="اكتب عنوان التوصيل داخل مكة"></textarea>
    </div>

    <div class="form-group">
      <label>طريقة الاستلام</label>

      <div class="order-option">

        <div
          class="option active"
          id="deliveryOption"
          onclick="selectDelivery('delivery')"
        >
          🚚 توصيل<br>
          <small>15 ريال</small>
        </div>

        <div
          class="option"
          id="pickupOption"
          onclick="selectDelivery('pickup')"
        >
          🏪 استلام من الفرع<br>
          <small>مجاناً</small>
        </div>

    </div>

    <div class="form-group">
      <label>طريقة الدفع</label>

      <select id="paymentMethod">
        <option value="دفع عند الاستلام">دفع عند الاستلام</option>
        <option value="تحويل بنكي">تحويل بنكي</option>

    </div>

    <div class="summary" id="orderSummary"></div>

    <button class="checkout-btn" onclick="sendOrder()">
      تأكيد الطلب عبر واتساب

</div>

/* =========================
   SETTINGS
========================= */

const DELIVERY_FEE = 15;
const FREE_SHIPPING_LIMIT = 100;
const COUPON_CODE = "NEXO50";
const COUPON_RATE = 0.50;
const WHATSAPP_NUMBER = "966501203710";

let selectedCategory = "الكل";
let couponApplied = false;
let deliveryMethod = "delivery";


/* =========================
   CART
========================= */

let cart = JSON.parse(localStorage.getItem("nexo_cart") || "[]");


function saveCart(){
  localStorage.setItem("nexo_cart", JSON.stringify(cart));
  updateCartCount();
}


function updateCartCount(){

  const count = cart.reduce(
    (total,item)=>total + item.qty,
    0
  );

  document.getElementById("cartCount").textContent = count;
}


function addToCart(id){

  const product = products.find(p => p.id === id);

  if(!product) return;

  const existing = cart.find(item => item.id === id);

  if(existing){
    existing.qty++;
  }else{
    cart.push({
      id:id,
      qty:1
    });
  }

  saveCart();

  alert("تمت إضافة المنتج إلى السلة");
}


function changeQty(id, amount){

  const item = cart.find(x => x.id === id);

  if(!item) return;

  item.qty += amount;

  if(item.qty <= 0){
    cart = cart.filter(x => x.id !== id);
  }

  saveCart();
  renderCart();
}


function removeFromCart(id){

  cart = cart.filter(x => x.id !== id);

  saveCart();
  renderCart();
}


/* =========================
   PRICE CALCULATIONS
========================= */

function getCartData(){

  let currentSubtotal = 0;
  let originalSubtotal = 0;

  cart.forEach(item => {

    const product = products.find(p => p.id === item.id);

    if(!product) return;

    currentSubtotal += product.price * item.qty;

    originalSubtotal += product.oldPrice * item.qty;
  });


  /*
    بدون كوبون:
    نستخدم السعر الحالي للمنتجات.
  */

  if(!couponApplied){

    const deliveryFee =
      deliveryMethod === "pickup"
        ? 0
        : (
            currentSubtotal >= FREE_SHIPPING_LIMIT
              ? 0
              : DELIVERY_FEE
          );

    return {
      currentSubtotal,
      originalSubtotal,
      discount:0,
      productsTotal:currentSubtotal,
      deliveryFee,
      total:currentSubtotal + deliveryFee
    };
  }


  /*
    NEXO50:

    مهم جداً:
    الخصم يُحسب من السعر الأصلي oldPrice.

    مثال:
    oldPrice = 30
    الخصم = 15
    السعر النهائي للمنتج = 15

    oldPrice = 20
    الخصم = 10
    السعر النهائي للمنتج = 10

    oldPrice = 10
    الخصم = 5
    السعر النهائي للمنتج = 5

    ولا يتم خصم أي شيء من رسوم التوصيل.
  */

  let discount = 0;

  cart.forEach(item => {

    const product = products.find(p => p.id === item.id);

    if(!product) return;

    discount +=
      (product.oldPrice * COUPON_RATE) * item.qty;
  });


  /*
    السعر النهائي للمنتجات بعد الكوبون
    = السعر الأصلي - قيمة الخصم
  */

  const productsTotal =
    Math.max(0, originalSubtotal - discount);


  /*
    التوصيل لا يدخل في الخصم.
    ونحافظ على شرط الشحن المجاني الموجود.
  */

  const deliveryFee =
    deliveryMethod === "pickup"
      ? 0
      : (
          currentSubtotal >= FREE_SHIPPING_LIMIT
            ? 0
            : DELIVERY_FEE
        );


  return {
    currentSubtotal,
    originalSubtotal,
    discount,
    productsTotal,
    deliveryFee,
    total:productsTotal + deliveryFee
  };
}


/* =========================
   PRODUCTS
========================= */

function renderProducts(){

  const box = document.getElementById("products");

  const search =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const filtered = products.filter(product => {

    const categoryMatch =
      selectedCategory === "الكل" ||
      product.category === selectedCategory;

    const searchMatch =
      product.name.toLowerCase().includes(search) ||
      product.desc.toLowerCase().includes(search);

    return categoryMatch && searchMatch;
  });


  if(filtered.length === 0){

    box.innerHTML = `
      <div class="empty">
        لا توجد منتجات مطابقة للبحث
      </div>
    `;

    return;
  }


  box.innerHTML = filtered.map(product => `

    <div class="product">

      <img
        class="product-image"
        src="${product.image}"
        alt="${product.name}"
        onerror="this.src='https://via.placeholder.com/400x400?text=NEXO+STORE'"
      >

      <div class="product-content">

        <div
          class="product-title"
          onclick="openProduct('${product.id}')"
          style="cursor:pointer"
        >
          ${product.name}
        </div>

        <div class="product-desc">
          ${product.desc}
        </div>

        <div class="price-box">

          <div class="old-price">
            ${product.oldPrice} ريال
          </div>

          <div class="price">
            ${product.price} ريال
          </div>

        </div>

        <button
          class="add-btn"
          onclick="addToCart('${product.id}')"
        >
          أضف للسلة
        </button>

      </div>

    </div>

  `).join("");
}


function setCategory(category,button){

  selectedCategory = category;

  document
    .querySelectorAll(".category")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  renderProducts();
}


/* =========================

========================= */

function openProduct(id){

  const product = products.find(p => p.id === id);

  if(!product) return;

  document.getElementById("homeView").style.display = "none";

  const detailView =
    document.getElementById("detailView");

  detailView.style.display = "block";

  detailView.innerHTML = `

    <button
      class="back-btn"
      onclick="closeProduct()"
    >
      ← الرجوع للمتجر
    </button>

    <div class="product-detail">

      <img
        src="${product.image}"
        alt="${product.name}"
        onerror="this.src='https://via.placeholder.com/500x500?text=NEXO+STORE'"
      >

      <div class="detail-title">
        ${product.name}
      </div>

      <div class="detail-desc">
        ${product.desc}
      </div>

      <div class="detail-price">

        <div class="old-price">
          ${product.oldPrice} ريال
        </div>

        <div class="price">
          ${product.price} ريال
        </div>

      </div>

      <button
        class="add-btn"
        onclick="addToCart('${product.id}')"

      </button>

    </div>
  `;

    top:0,
    behavior:"smooth"
  });
}


function closeProduct(){

  document.getElementById("detailView").style.display = "none";

  document.getElementById("homeView").style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

========================= */

}


function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");
}


function renderCart(){

  const itemsBox =
    document.getElementById("cartItems");

  const emptyBox =
    document.getElementById("cartEmpty");

  const summaryBox =
    document.getElementById("summaryBox");

  const cartSummary =
    document.getElementById("cartSummary");

  if(cart.length === 0){

    itemsBox.innerHTML = "";

    emptyBox.style.display = "block";

    cartSummary.style.display = "none";

    return;
  }

  emptyBox.style.display = "none";

  cartSummary.style.display = "block";


  itemsBox.innerHTML = cart.map(item => {

    const product =
      products.find(p => p.id === item.id);

    if(!product) return "";

    return `

      <div class="cart-item">

        <img
          src="${product.image}"
          alt="${product.name}"
          onerror="this.src='https://via.placeholder.com/100x100?text=NEXO'"
        >

        <div class="cart-info">

          <div class="cart-name">
            ${product.name}
          </div>

          <div class="cart-price">
            ${product.price} ريال
          </div>

          <div class="qty">

            <button onclick="changeQty('${product.id}',1)">
              +
            </button>

            <span>
              ${item.qty}
            </span>

            <button onclick="changeQty('${product.id}',-1)">
              −
            </button>

          </div>

        </div>

        <button
          class="delete-btn"
          onclick="removeFromCart('${product.id}')"
        >
          🗑
        </button>

      </div>
    `;

  }).join("");


  const data = getCartData();


  /* =========================
     SHIPPING NOTICE
  ========================= */

  const shippingNotice =
    document.getElementById("shippingNotice");


  if(
    deliveryMethod === "delivery" &&
    data.currentSubtotal < FREE_SHIPPING_LIMIT
  ){

    const remaining =
      FREE_SHIPPING_LIMIT - data.currentSubtotal;

    shippingNotice.innerHTML =
      `أضف ${remaining} ريال إضافية للحصول على توصيل مجاني!`;

  }else if(deliveryMethod === "pickup"){

    shippingNotice.innerHTML =
      `🏪 الاستلام من الفرع مجاني`;

  }else{

    shippingNotice.innerHTML =
      `🎉 حصلت على التوصيل المجاني`;

  }


  /* =========================
     SUMMARY
  ========================= */

  if(!couponApplied){

    summaryBox.innerHTML = `

      <div class="summary-row">
        <span>المجموع الفرعي (للمنتجات)</span>
        <strong>${data.currentSubtotal} ريال</strong>
      </div>

      <div class="summary-row">
        <span>رسوم التوصيل (مكة)</span>
        <strong>${data.deliveryFee} ريال</strong>
      </div>

      <div class="summary-row total">
        <span>الإجمالي النهائي</span>
        <strong>${data.total} ريال</strong>
      </div>

    `;

  }else{

    /*
      هنا نعرض الحساب الصحيح:

      السعر الأصلي للمنتجات = 30
      الخصم = 15
      المنتجات بعد الخصم = 15
      التوصيل = 15
      الإجمالي = 30
    */

    summaryBox.innerHTML = `

      <div class="summary-row">
        <span>قيمة المنتجات قبل الكوبون</span>
        <strong>${data.originalSubtotal} ريال</strong>
      </div>

      <div class="summary-row discount">
        <span>الخصم 50% على المنتجات</span>
        <strong>− ${data.discount} ريال</strong>
      </div>

      <div class="summary-row">
        <span>المنتجات بعد الخصم</span>
        <strong>${data.productsTotal} ريال</strong>
      </div>

      <div class="summary-row">
        <span>رسوم التوصيل (مكة)</span>
        <strong>${data.deliveryFee} ريال</strong>
      </div>

      <div class="summary-row total">
        <span>الإجمالي النهائي</span>
        <strong>${data.total} ريال</strong>
      </div>

    `;
  }


  const message =
    document.getElementById("couponMessage");

  if(couponApplied){

    message.className =
      "coupon-message coupon-success";

    message.textContent =
      "✓ تم تطبيق خصم 50% على المنتجات فقط";

  }else{

    message.className =
      "coupon-message";

    message.textContent = "";
  }
}


/* =========================
   COUPON
========================= */

function applyCoupon(){

  const input =
    document.getElementById("couponInput");

  const code =
    input.value.trim().toUpperCase();

  const message =
    document.getElementById("couponMessage");


  if(code === COUPON_CODE){

    couponApplied = true;

    message.className =
      "coupon-message coupon-success";

    message.textContent =
      "✓ تم تطبيق خصم 50% على المنتجات فقط";

    renderCart();

    return;
  }


  couponApplied = false;

  message.className =
    "coupon-message coupon-error";

  message.textContent =
    "✕ رمز الخصم غير صحيح";

  renderCart();
}

/* =========================
   SEND ORDER
========================= */

function sendOrder(){

  const name =
    document.getElementById("customerName")
      .value.trim();

  const phone =
    document.getElementById("customerPhone")
      .value.trim();

  const address =
    document.getElementById("customerAddress")
      .value.trim();

  const payment =
    document.getElementById("paymentMethod")
      .value;


  if(!name){

    alert("اكتب اسمك");
    return;
  }


  if(!phone){

    alert("اكتب رقم الجوال");
    return;
  }


  if(deliveryMethod === "delivery" && !address){

    alert("اكتب عنوان التوصيل");
    return;
  }


  const data = getCartData();


  const orderId =
    "NEXO-" +
    Date.now().toString().slice(-8);


  let itemsText = "";


  cart.forEach(item => {

    const product =
      products.find(p => p.id === item.id);

    if(!product) return;


    let itemPrice = product.price;

    if(couponApplied){

      itemPrice =
        product.oldPrice -
        (product.oldPrice * COUPON_RATE);
    }


    itemsText +=
      `• ${product.name} × ${item.qty} = ${itemPrice * item.qty} ريال\n`;
  });


  const order = {

    orderId,

    customerName:name,

    phone,

    address,

    deliveryMethod:
      deliveryMethod === "delivery"
        ? "توصيل"
        : "استلام من الفرع",

    paymentMethod:payment,

    items:cart,

    subtotal:
      couponApplied
        ? data.originalSubtotal
        : data.currentSubtotal,

    discount:
      data.discount,

    deliveryFee:
      data.deliveryFee,

    total:
      data.total,

    status:"جديد",

    createdAt:
      new Date().toISOString()
  };


  /* حفظ الطلب */
  const orders =
    JSON.parse(
      localStorage.getItem("nexo_orders") || "[]"
    );

  orders.push(order);

  localStorage.setItem(
    "nexo_orders",
    JSON.stringify(orders)
  );


  /* =========================
     WHATSAPP MESSAGE
  ========================= */

  let message =
`🛒 *طلب جديد - NEXO STORE*

رقم الطلب: ${orderId}

👤 الاسم: ${name}
📱 الجوال: ${phone}

📦 المنتجات:
${itemsText}
`;


  if(couponApplied){

    message +=
`💰 قيمة المنتجات الأصلية: ${data.originalSubtotal} ريال
🏷️ خصم NEXO50: ${data.discount} ريال
💵 المنتجات بعد الخصم: ${data.productsTotal} ريال
`;
  }else{

    message +=
`💰 مجموع المنتجات: ${data.productsTotal} ريال
`;
  }


  message +=
`🚚 رسوم التوصيل: ${data.deliveryFee} ريال
💳 طريقة الدفع: ${payment}
📍 طريقة الاستلام: ${
  deliveryMethod === "delivery"
    ? "توصيل"
    : "استلام من الفرع"
}

💵 *الإجمالي النهائي: ${data.total} ريال*
`;


  if(deliveryMethod === "delivery"){

    message +=
`\n📍 العنوان:
${address}`;
  }


  const whatsappURL =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(message);


  /*
    نفرغ السلة بعد إنشاء الطلب
  */

  cart = [];

  saveCart();

  window.open(
    whatsappURL,
    "_blank"
  );


  closeModal("orderModal");

}
