<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم NEXO STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo",sans-serif;background:#f5f7fa;color:#111;padding-bottom:40px}
header{background:#0876d9;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:6px 12px;font-family:inherit}
.tabs{display:flex;gap:6px;padding:10px;overflow-x:auto;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tabs button{flex:1;white-space:nowrap;border:0;border-radius:12px;padding:10px 14px;background:#eef1f5;font-family:inherit;font-weight:700}
.tabs button.on{background:#0876d9;color:#fff}
#view{max-width:700px;margin:auto;padding:12px}
.btn{background:#0876d9;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-family:inherit;font-weight:800;font-size:15px;margin-bottom:10px}
.row,.card{background:#fff;border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);display:flex;gap:10px;align-items:center}
.card{display:block;line-height:1.9}
.row.off{opacity:.5}
.row img{width:60px;height:60px;object-fit:contain;border-radius:10px;background:#fafafa}
.inf{flex:1;min-width:0}.inf b{display:block;font-size:14px}.inf small{color:#667}
.row button{border:0;background:#edf6ff;color:#0876d9;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:700}
.red{color:#d32f2f;font-weight:800}
select,input,textarea{width:100%;border:1px solid #d7dce2;border-radius:12px;padding:10px;font-family:inherit;font-size:15px;background:#fff}
input[type=checkbox]{width:22px;height:22px}
textarea{height:80px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
.box{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:520px}
.box label{display:block;font-weight:700;margin:10px 0 4px}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{flex:1;border:0;border-radius:12px;padding:12px;font-family:inherit;font-weight:800;background:#eef1f5}
.acts .btn{background:#0876d9;color:#fff;margin:0}.acts .del{background:#ffe9e9;color:#c62828}
.pv{width:90px;height:90px;object-fit:contain;display:block;margin-bottom:6px}
#toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;z-index:30}
#login{max-width:380px;margin:60px auto;padding:20px;background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
#login h2{margin-top:0;color:#0876d9}#login input{margin-bottom:10px}#lerr{color:#c62828;min-height:22px}
#app{display:none}
</style>
</head>
<body>
<div id="login">
<h2>دخول الأدمن</h2>
<input id="em" type="email" placeholder="الإيميل" autocomplete="username">
<input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<div id="lerr"></div>
<button class="btn" style="width:100%" id="loginBtn">دخول</button>
</div>

<div id="app">
<header><span>لوحة NEXO STORE</span><button id="outBtn">خروج</button></header>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const U='https://tycwaaqhpcvbgdqwzkgr.supabase.co',K='sb_publishable_BNl9LfB9ZhUAPWlH1IHsig_wT2Y7cop';
const SB=supabase.createClient(U,K);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const im=s=>!s?'../icon-192.png':/^http/.test(s)?s:'../'+s;
const TABS=[['products','المنتجات'],['ads','الإعلانات'],['orders','الطلبات'],['coupons','كودات الخصم'],['settings','الإعدادات']];
let tab='products',cats=[],P=[],A=[];
function msg(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function closeM(){$('modal').style.display='none'}

$('loginBtn').onclick=async()=>{
$('lerr').textContent='';
const{error}=await SB.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
if(error){$('lerr').textContent='بيانات الدخول غير صحيحة';return}
start();
};
$('outBtn').onclick=async()=>{await SB.auth.signOut();location.reload()};

async function start(){
const{data:{session}}=await SB.auth.getSession();
if(!session)return;
const{data}=await SB.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
if(!data){await SB.auth.signOut();$('lerr').textContent='هذا الحساب ليس أدمن';return}
$('login').style.display='none';$('app').style.display='block';
$('tabs').innerHTML=TABS.map(([k,l])=>`<button id="t_${k}" onclick="go('${k}')">${l}</button>`).join('');
go('products');
}

function go(t){
tab=t;
TABS.forEach(([k])=>$('t_'+k).classList.toggle('on',k===t));
$('view').innerHTML='<p>جاري التحميل...</p>';
({products:rProducts,ads:rAds,orders:rOrders,coupons:rCoupons,settings:rSet})[t]();
}

async function up(f){
const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
const path=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
const{error}=await SB.storage.from('product-images').upload(path,f,{contentType:f.type});
if(error)throw error;
return SB.storage.from('product-images').getPublicUrl(path).data.publicUrl;
}

function form(title,fields,v,save,del){
const m=$('modal');
m.innerHTML=`<div class="box"><h3>${title}</h3>`+fields.map(([k,l,t,o])=>{
const val=v[k]??'';let h;
if(t==='area')h=`<textarea id="f_${k}">${esc(val)}</textarea>`;
else if(t==='sel')h=`<select id="f_${k}">${o.map(x=>`<option ${x==val?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
else if(t==='chk')h=`<input type="checkbox" id="f_${k}" ${val?'checked':''}>`;
else if(t==='img')h=`${val?`<img class="pv" src="${esc(im(val))}">`:''}<input type="file" id="f_${k}" accept="image/*">`;
else h=`<input id="f_${k}" type="${t==='num'?'number':'text'}" step="any" value="${esc(val)}">`;
return `<label>${l}</label>${h}`}).join('')+
`<div class="acts"><button class="btn" id="saveBtn">حفظ</button><button onclick="closeM()">إلغاء</button>${del?'<button class="del" id="delBtn">حذف</button>':''}</div></div>`;
m.style.display='flex';
$('saveBtn').onclick=async()=>{
$('saveBtn').disabled=true;
try{
const o={};
for(const[k,,t]of fields){
const e=$('f_'+k);
if(t==='chk')o[k]=e.checked;
else if(t==='num')o[k]=parseFloat(e.value)||0;
else if(t==='img')o[k]=e.files[0]?await up(e.files[0]):(v[k]||null);
else o[k]=e.value.trim();
}
await save(o);closeM();msg('تم الحفظ ✓');go(tab);
}catch(e){msg('خطأ: '+(e.message||e));$('saveBtn').disabled=false}
};
if(del)$('delBtn').onclick=async()=>{
if(!confirm('تأكيد الحذف؟'))return;
try{await del();closeM();msg('تم الحذف');go(tab)}catch(e){msg('خطأ: '+(e.message||e))}
};
}

/* ---- المنتجات ---- */
async function rProducts(){
const[c,p]=await Promise.all([SB.from('categories').select('*').order('sort'),SB.from('products').select('*').order('sort')]);
cats=c.data||[];P=p.data||[];
$('view').innerHTML='<button class="btn" onclick="editP()">+ منتج جديد</button>'+P.map(x=>`<div class="row ${x.is_active?'':'off'}"><img src="${esc(im(x.image))}" alt=""><div class="inf"><b>${esc(x.name)}</b><small>${x.price} ر.س · الكمية: <span class="${x.stock<=0?'red':''}">${x.stock<=0?'نفدت':x.stock}</span></small></div><button onclick="editP('${esc(x.id)}')">تعديل</button></div>`).join('');
}
function editP(id){
const p=P.find(x=>x.id===id)||{is_active:true,stock:0,category:cats[0]&&cats[0].name};
form(id?'تعديل منتج':'منتج جديد',[
['name','الاسم','t'],['description','الوصف','area'],['old_price','السعر الأصلي (قبل الخصم)','num'],['price','السعر الحالي','num'],
['category','الفئة','sel',cats.map(c=>c.name)],['stock','الكمية المتوفرة','num'],['image','الصورة (ترفع تلقائيًا)','img'],['is_active','ظاهر في المتجر','chk']
],p,async o=>{
if(!o.name)throw new Error('اكتب الاسم');
o.stock=Math.max(0,Math.round(o.stock));
o.id=id||'p'+Date.now();
const{error}=await SB.from('products').upsert(o);if(error)throw error;
},id?async()=>{const{error}=await SB.from('products').delete().eq('id',id);if(error)throw error}:null);
}

/* ---- الإعلانات ---- */
async function rAds(){
const{data}=await SB.from('ads').select('*').order('sort');A=data||[];
$('view').innerHTML='<button class="btn" onclick="editA()">+ إعلان جديد</button>'+A.map(x=>`<div class="row ${x.is_active?'':'off'}"><img src="${esc(im(x.image_url))}" alt=""><div class="inf"><b>${esc(x.title)||'(بدون عنوان)'}</b><small>${x.placement==='home_banner'?'بانر الرئيسية':'فوق المنتجات'}</small></div><button onclick="editA('${x.id}')">تعديل</button></div>`).join('');
}
function editA(id){
const a=A.find(x=>x.id===id)||{is_active:true,placement:'home_banner',sort:0,bg:'linear-gradient(135deg,#0876d9,#00c6ff)'};
form(id?'تعديل إعلان':'إعلان جديد',[
['title','العنوان','t'],['subtitle','النص الفرعي','t'],['image_url','صورة الإعلان (اختياري)','img'],
['button_text','نص الزر','t'],['button_link','رابط الزر (https://...)','t'],
['placement','مكان الظهور: home_banner = بانر الرئيسية، above_products = فوق المنتجات','sel',['home_banner','above_products']],
['sort','الترتيب (الأصغر أولًا)','num'],['bg','لون الخلفية (إذا بدون صورة)','t'],['is_active','فعّال','chk']
],a,async o=>{
if(o.button_link&&!/^https?:\/\/|^https:\/\/wa\.me/.test(o.button_link))throw new Error('الرابط لازم يبدأ بـ https://');
const{error}=await(id?SB.from('ads').update(o).eq('id',id):SB.from('ads').insert(o));if(error)throw error;
},id?async()=>{const{error}=await SB.from('ads').delete().eq('id',id);if(error)throw error}:null);
}

/* ---- كودات الخصم ---- */
let C=[];
async function rCoupons(){
const{data}=await SB.from('coupons').select('*').order('code');C=data||[];
$('view').innerHTML='<button class="btn" onclick="editC()">+ كود جديد</button>'+C.map(x=>`<div class="row ${x.is_active?'':'off'}"><div class="inf"><b>${esc(x.code)}</b><small>خصم ${Math.round(x.rate*100)}% من السعر الأصلي</small></div><button onclick="editC('${esc(x.code)}')">تعديل</button></div>`).join('');
}
function editC(code){
const c=C.find(x=>x.code===code);
form(code?'تعديل كود':'كود جديد',[['code','الكود (حروف إنجليزية وأرقام بدون مسافات)','t'],['percent','نسبة الخصم %','num'],['is_active','فعّال','chk']],
c?{code:c.code,percent:Math.round(c.rate*100),is_active:c.is_active}:{is_active:true,percent:10},
async o=>{
o.code=o.code.toUpperCase().replace(/\s/g,'');
if(!/^[A-Z0-9_-]{3,20}$/.test(o.code))throw new Error('الكود من 3 إلى 20 حرف إنجليزي أو رقم');
if(!(o.percent>0&&o.percent<=100))throw new Error('النسبة من 1 إلى 100');
const{error}=await SB.from('coupons').upsert({code:o.code,rate:o.percent/100,is_active:o.is_active});if(error)throw error;
if(code&&code!==o.code)await SB.from('coupons').delete().eq('code',code);
},code?async()=>{const{error}=await SB.from('coupons').delete().eq('code',code);if(error)throw error}:null);
}

/* ---- الطلبات ---- */
async function rOrders(){
const{data}=await SB.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(100);
$('view').innerHTML=(data||[]).map(o=>`<div class="card"><b>${esc(o.id)}</b> · ${o.total} ر.س<br><small>${esc(o.customer_name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>${o.delivery_method==='delivery'?'توصيل':'استلام'} · ${esc(o.payment_method)}${o.address?'<br>'+esc(o.address):''}<br>${o.order_items.map(i=>esc(i.name)+' ×'+i.qty).join('<br>')}<br>${new Date(o.created_at).toLocaleString('ar-SA')}</small><select onchange="setSt('${esc(o.id)}',this.value)">${['جديد','قيد التجهيز','تم التسليم','ملغي'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p>لا توجد طلبات بعد</p>';
}
async function setSt(id,s){const{error}=await SB.from('orders').update({status:s}).eq('id',id);msg(error?'تعذر التحديث':'تم ✓')}

/* ---- الإعدادات ---- */
async function rSet(){
const{data}=await SB.from('settings').select('*').eq('id',1).single();
$('view').innerHTML=`<div class="card">رسوم التوصيل: <b>${data.delivery_fee}</b> ر.س<br>حد التوصيل المجاني: <b>${data.free_shipping_limit}</b> ر.س</div><button class="btn" id="eS">تعديل</button>`;
$('eS').onclick=()=>form('الإعدادات',[['delivery_fee','رسوم التوصيل','num'],['free_shipping_limit','حد التوصيل المجاني','num']],data,async o=>{
const{error}=await SB.from('settings').update(o).eq('id',1);if(error)throw error});
}

start();
</script>
</body>
</html>
