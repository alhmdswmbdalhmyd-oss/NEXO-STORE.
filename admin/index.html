<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم NEXO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fa;color:#111;padding-bottom:70px}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);line-height:1.8;overflow-wrap:anywhere}
input,select,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid #d7dce2;border-radius:12px;margin:4px 0 8px}
input[type=checkbox]{width:22px;height:22px}button{background:#0876d9;color:#fff;border:0;font-weight:700;cursor:pointer}
button.d{background:#e53950}.row{display:flex;gap:8px}.row>*{flex:1}label{font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;box-shadow:0 -3px 14px rgba(0,0,0,.1);overflow-x:auto}
nav button{background:none;color:#667;border-radius:0;margin:0;padding:12px 10px;font-size:13px;white-space:nowrap;width:auto;flex:1}
nav button.on{color:#0876d9;border-top:3px solid #0876d9}.th{width:64px;height:64px;object-fit:contain;display:block}
.st{background:#edf6ff;color:#0876d9;border-radius:10px;padding:2px 10px;font-size:13px}.un{border-right:4px solid #e53950}
#lg{max-width:380px;margin:12vh auto}#app{display:none}h2,h3{margin:8px 12px}
</style></head><body>
<div id="lg" class="card"><h2>🔐 دخول لوحة التحكم</h2>
<input id="em" type="email" placeholder="الإيميل" autocomplete="username">
<input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
<button onclick="login()">دخول</button></div>
<div id="app"><div id="main"></div>
<nav>
<button data-t="orders" onclick="go('orders')">🛒 الطلبات</button>
<button data-t="nexo_products" onclick="go('nexo_products')">📦 المنتجات</button>
<button data-t="nexo_ads" onclick="go('nexo_ads')">📣 الإعلانات</button>
<button data-t="nexo_coupons" onclick="go('nexo_coupons')">🎟 الكوبونات</button>
<button data-t="messages" onclick="go('messages')">💬 الرسائل</button>
<button data-t="settings" onclick="go('settings')">⚙️ الإعدادات</button>
</nav></div>
<script>
const U="https://hmvjxesfgfjjhangyorq.supabase.co",K="sb_publishable_SZdbk--nDfsTzqlARh3IcA_ZnGm1QPL";
const sb=supabase.createClient(U,K),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STS=["جديد","قيد التجهيز","تم التوصيل","ملغي"];
const T={
nexo_products:{f:[["name","الاسم","t"],["description","الوصف","a"],["category","الفئة (شواحن/كيابل/سماعات/سيارات/متنوع)","t"],["price","السعر","n"],["old_price","السعر قبل الخصم","n"],["barcode","الباركود","t"],["image_url","الصورة","i"],["sort","الترتيب","n"],["active","ظاهر في المتجر","c"]],show:"name",order:"sort"},
nexo_ads:{f:[["title","العنوان","t"],["subtitle","النص الفرعي","t"],["image_url","صورة (اختياري)","i"],["sort","الترتيب","n"],["active","ظاهر","c"]],show:"title",order:"sort"},
nexo_coupons:{f:[["code","الكود","t"],["rate","نسبة الخصم (0.5 = ٥٠٪)","n"],["active","فعّال","c"]],show:"code",pk:"code",order:"created_at"}};
const SF=[["store_name","اسم المتجر","t"],["whatsapp","رقم الواتساب (بدون +)","t"],["delivery_fee","رسوم التوصيل","n"],["free_shipping_limit","حد التوصيل المجاني","n"],["delivery_banner","نص شريط التوصيل","t"],["logo_url","الشعار","i"]];
let cur="orders",E={},L=[];
const fld=([k,l,ty],v)=>`<label>${l}</label>`+(ty=="a"?`<textarea id="f_${k}">${esc(v)}</textarea>`:ty=="c"?`<br><input type="checkbox" id="f_${k}" ${v!==false?"checked":""}>`:ty=="i"?`${v?`<img src="${esc(v)}" class="th">`:""}<input type="file" id="f_${k}_file" accept="image/*">`:`<input id="f_${k}" type="${ty=="n"?"number":"text"}" step="any" value="${esc(v)}">`);
async function up(f){const n=Date.now()+"-"+f.name.replace(/[^\w.-]/g,"_");const{error}=await sb.storage.from("nexo-images").upload(n,f);if(error)throw error;return sb.storage.from("nexo-images").getPublicUrl(n).data.publicUrl}
async function val([k,l,ty]){const e=$("f_"+k);if(ty=="c")return e.checked;if(ty=="n")return Number(e.value||0);if(ty=="i"){const fl=$("f_"+k+"_file").files[0];return fl?await up(fl):(E[k]||"")}return e.value.trim()}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),500)}catch(e){}}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)return alert("بيانات الدخول غير صحيحة");enter()}
async function enter(){const{data:ok}=await sb.rpc("nexo_is_admin");if(!ok){alert("هذا الحساب غير مصرّح له");await sb.auth.signOut();return}
$("lg").style.display="none";$("app").style.display="block";
if("Notification"in window)Notification.requestPermission();
sb.channel("o").on("postgres_changes",{event:"INSERT",schema:"public",table:"nexo_orders"},p=>{beep();if("Notification"in window&&Notification.permission=="granted")new Notification("🛒 طلب جديد",{body:p.new.order_no+" — "+p.new.total+" ريال"});if(cur=="orders")go("orders")}).subscribe();
go("orders")}
function go(t){cur=t;E={};document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));({orders,messages,settings}[t]||(()=>crud(t)))(t)}
async function orders(){const{data}=await sb.from("nexo_orders").select("*").order("created_at",{ascending:false}).limit(200);
$("main").innerHTML=`<h3>🛒 الطلبات (${(data||[]).length})</h3>`+((data||[]).map(o=>`<div class="card ${o.status=="جديد"?"un":""}"><b>${esc(o.order_no)}</b> <span class="st">${esc(o.status)}</span><br>👤 ${esc(o.customer_name)} — 📱 <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>📍 ${esc(o.address)}<br>${(o.items||[]).map(i=>esc(i.name)+" × "+i.qty).join("<br>")}<br><b>${o.total} ريال</b> (${esc(o.delivery_method)} / ${esc(o.payment_method)})${o.coupon_code?" 🎟 "+esc(o.coupon_code):""}<br><small>${new Date(o.created_at).toLocaleString("ar-SA")}</small>
<div class="row"><select onchange="st('${o.id}',this.value)">${STS.map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select><button class="d" onclick="del('nexo_orders','${o.id}')">حذف</button></div></div>`).join("")||'<div class="card">لا توجد طلبات</div>')}
async function st(id,v){const{error}=await sb.from("nexo_orders").update({status:v}).eq("id",id);if(error)alert(error.message)}
async function del(t,id){if(!confirm("متأكد من الحذف؟"))return;const{error}=await sb.from(t).delete().eq("id",id);if(error)alert(error.message);go(cur)}
async function messages(){const{data}=await sb.from("nexo_messages").select("*").order("created_at",{ascending:false}).limit(200);
$("main").innerHTML=`<h3>💬 الرسائل والشكاوى</h3>`+((data||[]).map(m=>`<div class="card ${m.is_read?"":"un"}"><b>${esc(m.topic)}</b> — ${esc(m.name)} ${m.phone?"📱 "+esc(m.phone):""}<br>${esc(m.body)}<br><small>${new Date(m.created_at).toLocaleString("ar-SA")}</small><div class="row"><button onclick="rd('${m.id}',${!m.is_read})">${m.is_read?"إرجاع كغير مقروءة":"تمت القراءة"}</button><button class="d" onclick="del('nexo_messages','${m.id}')">حذف</button></div></div>`).join("")||'<div class="card">لا توجد رسائل</div>')}
async function rd(id,v){await sb.from("nexo_messages").update({is_read:v}).eq("id",id);go("messages")}
async function crud(t){const c=T[t],pk=c.pk||"id";const{data}=await sb.from(t).select("*").order(c.order,{ascending:true});L=data||[];
$("main").innerHTML=`<div class="card"><h3>${E[pk]!==undefined?"تعديل":"إضافة جديد"}</h3>${c.f.map(f=>fld(f,E[f[0]])).join("")}<button onclick="save('${t}')">حفظ</button>${E[pk]!==undefined?`<button class="d" onclick="E={};crud('${t}')">إلغاء التعديل</button>`:""}</div>`+L.map((r,i)=>`<div class="card">${r.image_url?`<img src="${esc(r.image_url)}" class="th">`:""}<b>${esc(r[c.show])}</b> ${r.price!=null?r.price+" ريال":""}${r.rate!=null?" — "+r.rate*100+"%":""} ${r.active?"":"<span class='st'>مخفي</span>"}<div class="row"><button onclick="E=L[${i}];crud('${t}');scrollTo(0,0)">تعديل</button><button class="d" onclick="rm('${t}',${i})">حذف</button></div></div>`).join("")}
async function save(t){const c=T[t],r={};try{for(const f of c.f)r[f[0]]=await val(f);if(E.id&&!c.pk)r.id=E.id;if(!r[c.show])return alert("املأ الحقل الأساسي");
const{error}=await sb.from(t).upsert(r);if(error)throw error;E={};crud(t)}catch(e){alert(e.message)}}
async function rm(t,i){const c=T[t],pk=c.pk||"id";if(!confirm("متأكد من الحذف؟"))return;const{error}=await sb.from(t).delete().eq(pk,L[i][pk]);if(error)alert(error.message);crud(t)}
async function settings(){const{data}=await sb.from("nexo_settings").select("*");E={};(data||[]).forEach(r=>E[r.key]=r.value);
$("main").innerHTML=`<div class="card"><h3>⚙️ إعدادات المتجر</h3>${SF.map(f=>fld(f,E[f[0]])).join("")}<button onclick="saveSet()">حفظ</button></div>`}
async function saveSet(){try{const rows=[];for(const f of SF)rows.push({key:f[0],value:await val(f)});const{error}=await sb.from("nexo_settings").upsert(rows);if(error)throw error;alert("تم الحفظ ✅");settings()}catch(e){alert(e.message)}}
(async()=>{const{data:{session}}=await sb.auth.getSession();if(session)enter()})();
</script></body></html>
