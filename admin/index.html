<style>
:root{--n:#07152e;--b:#1470e6;--g:#f5b942;--bg:#eef2f9;--sh:0 8px 26px rgba(20,40,90,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:#122036;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:14px;padding:11px 16px;background:linear-gradient(135deg,#1a7cf5,#0b57c4);color:#fff;font-weight:700;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}button.d{background:#fdecee;color:#e53950}button.g{background:#eaf0fa;color:#33415c}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid #dbe2ee;border-radius:14px;background:#fff;outline:none;margin:4px 0 10px;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(20,112,230,.12)}input[type=checkbox]{width:24px;height:24px}
label{font-weight:700;font-size:14px;color:#3b4a66}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 10%,#1a5fd0,#07152e 70%);padding:18px}
#lg .box{background:#fff;border-radius:28px;padding:32px 26px;width:100%;max-width:390px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.4);animation:up .5s}
#lg .lo{width:78px;height:78px;margin:0 auto 10px;border-radius:24px;background:linear-gradient(135deg,#1a7cf5,#07152e);display:flex;align-items:center;justify-content:center;font-size:38px}
#lg h2{margin:6px 0 20px;color:var(--n)}#lg button{width:100%;padding:14px;font-size:17px}
#app{display:none;min-height:100vh}
#sb{display:none;width:260px;flex:0 0 260px;background:linear-gradient(180deg,#07152e,#0a3a7a);color:#fff;padding:20px 14px;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.br{font-size:24px;font-weight:800;padding:6px 12px 20px}.br span{color:var(--g)}
.nv{display:flex;align-items:center;gap:12px;background:none;color:#c6d8ff;text-align:right;padding:13px 14px;border-radius:14px;width:100%;font-size:16px}
.nv.on{background:rgba(255,255,255,.16);color:#fff}
.bd{margin-right:auto;background:#e53950;color:#fff;border-radius:11px;padding:0 7px;font-size:12px;display:none;line-height:20px;min-width:20px;text-align:center}
#mn{flex:1;min-width:0}
.hd{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#07152e,#0d3b8c);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 20px;border-radius:0 0 30px 30px;box-shadow:0 12px 32px rgba(7,21,46,.28)}
.hd small{color:var(--g);font-weight:800;letter-spacing:1px}.hd h2{margin:2px 0 0;font-size:24px}
#main{padding:16px;max-width:1200px;margin:auto;animation:up .35s}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.sc{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:22px;padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.sc i{font-style:normal;font-size:28px;position:absolute;left:12px;top:10px;opacity:.35}.sc small{opacity:.9;display:block;font-size:13px}.sc b{font-size:28px;font-weight:800}
.bar{display:flex;gap:10px;margin-bottom:12px}.bar input{margin:0}.bar button{white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;scrollbar-width:none}.ft{background:#fff;color:#445;white-space:nowrap;box-shadow:var(--sh)}.ft.on{background:linear-gradient(135deg,#1a7cf5,#0b57c4);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card,.pc{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--sh);overflow-wrap:anywhere;line-height:1.8;animation:up .35s}
.card.nw{border-right:5px solid var(--b)}.card h3{margin-top:0}
.pc{padding:0;overflow:hidden}.pc img,.ph{width:100%;height:180px;object-fit:contain;background:linear-gradient(135deg,#f6f9ff,#eaf0fa);display:flex;align-items:center;justify-content:center;font-size:46px}
.pb{padding:14px}.pm{color:var(--b);font-weight:800;margin:4px 0 10px;font-size:17px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1;margin:0}
.chip{border-radius:11px;padding:3px 12px;font-size:13px;font-weight:800;background:#eaf0fa;white-space:nowrap}
.em{text-align:center;color:#8a96ab;padding:34px}.th{width:72px;height:72px;object-fit:contain;display:block;border-radius:12px;background:#f3f6fb}
.li{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eef1f6;align-items:center}.li:last-child{border:0}
.itm{background:#f4f7fc;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px}.tot{font-size:22px;font-weight:800;color:var(--b)}
.wb{background:linear-gradient(135deg,#2ee27a,#12a84e);color:#fff;border-radius:14px;padding:11px 16px;text-decoration:none;font-weight:700;text-align:center}
.fab{position:fixed;left:18px;bottom:calc(104px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;font-size:30px;padding:0;z-index:35;box-shadow:0 12px 28px rgba(11,87,196,.45)}
#bt{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:28px;box-shadow:0 14px 40px rgba(7,21,46,.25);display:flex;padding:6px;z-index:40}
#bt button{flex:1;position:relative;background:none;color:#6b7a95;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;font-size:11.5px;border-radius:22px}
#bt button i{font-style:normal;font-size:22px}#bt button.on{background:linear-gradient(135deg,#1a7cf5,#0b57c4);color:#fff}
#bt .bd{position:absolute;top:2px;left:50%;margin:0 0 0 6px}
#md,#sh{position:fixed;inset:0;background:rgba(7,21,46,.55);backdrop-filter:blur(3px);display:none;z-index:60;align-items:flex-end;justify-content:center}
#md.on,#sh.on{display:flex}
#md .card{width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s}
.sp{width:100%;max-width:560px;background:#fff;border-radius:28px 28px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s}
.grab{width:44px;height:5px;border-radius:5px;background:#d5dce8;margin:0 auto 14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:#f1f5fc;color:#122036;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 6px}.tile i{font-style:normal;font-size:28px}
#ts{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#07152e;color:#fff;padding:10px 20px;border-radius:20px;z-index:99;display:none;font-weight:700}
.chat{display:grid;grid-template-columns:1fr;height:calc(100vh - 210px);min-height:420px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--sh)}
.cl{overflow-y:auto}.cw{display:none;flex-direction:column;min-width:0;background:#e9eff8}.chat.open .cl{display:none}.chat.open .cw{display:flex}
.ci{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid #f0f3f8;cursor:pointer}.ci.on,.ci:active{background:#edf4ff}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#1a7cf5,#07152e);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 48px;font-size:19px}
.cx{min-width:0;flex:1}.cx p{margin:0;color:#7a879c;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid #e8edf5}.ch>div{flex:1;min-width:0}
.oi{background:#fff8e6;padding:10px 14px;font-size:14px;line-height:1.9}.oi select{width:auto;margin:0 6px;padding:4px 8px;font-size:14px}
.cb{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column}
.bb{max-width:80%;padding:9px 13px;border-radius:18px;margin:4px 0;line-height:1.7;overflow-wrap:anywhere;box-shadow:0 1px 4px rgba(0,0,0,.06)}.bb small{display:block;color:#8a96ab;font-size:11px}
.bb.c{background:#fff;align-self:flex-start}.bb.a{background:#cfe5ff;align-self:flex-end}
.cf{display:flex;gap:8px;padding:10px;background:#fff}.cf input{margin:0}
@media(min-width:900px){
body{padding-bottom:40px}#app.on{display:flex}#sb{display:flex}#bt{display:none}.stats{grid-template-columns:repeat(5,1fr)}
.fab{bottom:30px}.chat{grid-template-columns:340px 1fr;height:calc(100vh - 190px)}.chat .cl{border-left:1px solid #e8edf5;display:block!important}.chat .cw{display:flex}
#md,#sh{align-items:center}#md .card,.sp{border-radius:28px}.bk{display:none}}
</style></head><body>
<div id="lg"><div class="box"><div class="lo">🛍️</div><h2>لوحة تحكم NEXO</h2>
<input id="em" type="email" placeholder="الإيميل" autocomplete="username">

<button class="nv" style="margin-top:auto" onclick="out()">🚪 تسجيل الخروج</button></aside>

<div id="sh" onclick="if(event.target==this)closeSheet()"><div class="sp" id="sp"></div></div>
<div id="md" onclick="if(event.target==this)closeM()"><div class="card" id="mc"></div></div>
<div id="ts"></div>
<script>
const U="https://hmvjxesfgfjjhangyorq.supabase.co",K="sb_publishable_SZdbk--nDfsTzqlARh3IcA_ZnGm1QPL";
const sb=supabase.createClient(U,K),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STS=["جديد","قيد التجهيز","تم التوصيل","ملغي"],SC={"جديد":"#1470e6","قيد التجهيز":"#f5a623","تم التوصيل":"#1f9d55","ملغي":"#e53950"};
const NAV=[["dash","🏠","الرئيسية"],["orders","🛒","الطلبات"],["messages","💬","الرسائل"],["nexo_products","📦","المنتجات"],["nexo_ads","📣","الإعلانات"],["nexo_coupons","🎟","الكوبونات"],["settings","⚙️","الإعدادات"]];
const BT=["dash","orders","messages","nexo_products"];
const T={
nexo_products:{ic:"📦",f:[["name","اسم المنتج","t"],["description","الوصف","a"],["category","الفئة (شواحن / كيابل / سماعات / سيارات / متنوع)","t"],["price","السعر","n"],["old_price","السعر قبل الخصم","n"],["barcode","الباركود","t"],["image_url","صورة المنتج","i"],["sort","الترتيب","n"],["active","ظاهر في المتجر","c"]],show:"name",order:"sort"},
nexo_ads:{ic:"📣",f:[["title","عنوان الإعلان","t"],["subtitle","النص الفرعي","t"],["image_url","صورة الإعلان (اختياري)","i"],["sort","الترتيب","n"],["active","ظاهر","c"]],show:"title",order:"sort"},
nexo_coupons:{ic:"🎟",f:[["code","كود الخصم","t"],["rate","نسبة الخصم (0.5 = ٥٠٪)","n"],["active","فعّال","c"]],show:"code",pk:"code",order:"created_at"}};
const SF=[["store_name","اسم المتجر","t"],["whatsapp","رقم الواتساب (بدون +)","t"],["delivery_fee","رسوم التوصيل","n"],["free_shipping_limit","حد التوصيل المجاني","n"],["delivery_banner","نص شريط التوصيل","t"],["logo_url","الشعار","i"]];
let cur="dash",E={},L=[],conv=null,MS=[],OD=[],OF="الكل",ex=0;const LY=[];
const fmt=d=>new Date(d).toLocaleString("ar-SA",{dateStyle:"short",timeStyle:"short"});
const wa=p=>"https://wa.me/"+String(p).replace(/\D/g,"").replace(/^0/,"966");
const chip=s=>`<span class="chip" style="background:${SC[s]||"#889"}1f;color:${SC[s]||"#889"}">${esc(s)}</span>`;
const fld=([k,l,ty],v)=>`<label>${l}</label>`+(ty=="a"?`<textarea id="f_${k}" rows="3">${esc(v)}</textarea>`:ty=="c"?`<br><input type="checkbox" id="f_${k}" ${v!==false?"checked":""}>`:ty=="i"?`${v?`<img src="${esc(v)}" class="th">`:""}<input type="file" id="f_${k}_file" accept="image/*">`:`<input id="f_${k}" type="${ty=="n"?"number":"text"}" step="any" value="${esc(v)}">`);
async function up(f){const n=Date.now()+"-"+f.name.replace(/[^\w.-]/g,"_");const{error}=await sb.storage.from("nexo-images").upload(n,f);if(error)throw error;return sb.storage.from("nexo-images").getPublicUrl(n).data.publicUrl}
async function val([k,l,ty]){const e=$("f_"+k);if(ty=="c")return e.checked;if(ty=="n")return Number(e.value||0);if(ty=="i"){const fl=$("f_"+k+"_file").files[0];return fl?await up(fl):(E[k]||"")}return e.value.trim()}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),500)}catch(e){}}
function ping(t,b){beep();if("Notification"in window&&Notification.permission=="granted")new Notification(t,{body:b})}
function toast(m){const t=$("ts");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
/* navigation layers: back gesture closes panels first, then goes to previous section */
function layer(n){LY.push(n);history.pushState({l:n},"")}
function shut(n){if(n=="m")$("md").classList.remove("on");else if(n=="s")$("sh").classList.remove("on");else if(n=="c"){const c=$("chat");if(c)c.classList.remove("open");conv=null;if($("cl"))convs()}}
function closeM(){LY.includes("m")?history.back():shut("m")}
function closeSheet(){LY.includes("s")?history.back():shut("s")}
function closeChat(){LY.includes("c")?history.back():shut("c")}
addEventListener("popstate",e=>{
if(LY.length){shut(LY.pop());return}
if($("app").style.display!="flex")return;
const s=e.state||{};
if(s.x){if(Date.now()-ex<2500){history.back();return}ex=Date.now();toast("اسحب للخلف مرة ثانية للخروج");history.pushState({t:cur},"");return}
if(s.l){history.back();return}
if(s.t)go(s.t,false)});
function out(){sb.auth.signOut().then(()=>location.reload())}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)return alert("بيانات الدخول غير صحيحة");enter()}
async function enter(){const{data:ok}=await sb.rpc("nexo_is_admin");if(!ok){alert("هذا الحساب غير مصرّح له");await sb.auth.signOut();return}
$("lg").style.display="none";$("app").style.display="flex";$("app").classList.add("on");
$("nav").innerHTML=NAV.map(n=>`<button class="nv" data-t="${n[0]}" onclick="go('${n[0]}')">${n[1]} ${n[2]}<span class="bd" data-b="${n[0]}"></span></button>`).join("");
$("bt").innerHTML=BT.map(id=>{const n=NAV.find(x=>x[0]==id);return`<button data-t="${id}" onclick="go('${id}')"><i>${n[1]}</i>${n[2]}<span class="bd" data-b="${id}"></span></button>`}).join("")+`<button data-t="more" onclick="more()"><i>☰</i>المزيد</button>`;
if("Notification"in window)Notification.requestPermission();
history.replaceState({x:1},"");history.pushState({t:"dash"},"");
sb.channel("rt").on("postgres_changes",{event:"INSERT",schema:"public",table:"nexo_orders"},p=>{ping("🛒 طلب جديد",p.new.order_no+" — "+p.new.total+" ريال");badges();if(cur=="orders"||cur=="dash")go(cur,false)})
.on("postgres_changes",{event:"INSERT",schema:"public",table:"nexo_messages"},p=>{if(p.new.sender!="customer")return;ping("💬 رسالة جديدة",(p.new.order_no||p.new.name)+": "+p.new.body);badges();
if(cur=="messages"){MS.push(p.new);conv&&conv==ck(p.new)?openConv(conv):convs()}}).subscribe();
go("dash",false)}
async function badges(){const[a,b]=await Promise.all([sb.from("nexo_orders").select("id",{count:"exact",head:true}).eq("status","جديد"),sb.from("nexo_messages").select("id",{count:"exact",head:true}).eq("is_read",false).eq("sender","customer")]);
[["orders",a.count],["messages",b.count]].forEach(([k,n])=>document.querySelectorAll(`[data-b="${k}"]`).forEach(e=>{e.textContent=n;e.style.display=n?"block":"none"}))}
function go(t,push=true){LY.length=0;cur=t;E={};if(push&&!(history.state&&history.state.t==t))history.pushState({t},"");
document.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t==t||(b.dataset.t=="more"&&!BT.includes(t))));
$("tt").textContent=NAV.find(n=>n[0]==t)[2];$("sh").classList.remove("on");$("md").classList.remove("on");badges();({dash,orders,messages,settings}[t]||list)(t)}
function more(){$("sp").innerHTML=`<div class="grab"></div><div class="tiles">${NAV.filter(n=>!BT.includes(n[0])).map(n=>`<button class="tile" onclick="pick('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join("")}</div><button class="d" style="width:100%" onclick="out()">🚪 تسجيل الخروج</button>`;$("sh").classList.add("on");layer("s")}
function pick(t){LY.length=0;$("sh").classList.remove("on");history.replaceState({t:cur},"");go(t)}
async function dash(){const[{data:o},a,b]=await Promise.all([sb.from("nexo_orders").select("*").order("created_at",{ascending:false}).limit(300),sb.from("nexo_products").select("id",{count:"exact",head:true}),sb.from("nexo_messages").select("id",{count:"exact",head:true}).eq("is_read",false).eq("sender","customer")]);
const O=o||[],td=O.filter(x=>new Date(x.created_at).toDateString()==new Date().toDateString()&&x.status!="ملغي");
const sc=(i,l,v,c1,c2)=>`<div class="sc" style="--c1:${c1};--c2:${c2}"><i>${i}</i><small>${l}</small><b>${v}</b></div>`;
$("main").innerHTML=`<div class="stats">${sc("🆕","طلبات جديدة",O.filter(x=>x.status=="جديد").length,"#1a7cf5","#0b3f94")}${sc("📅","طلبات اليوم",td.length,"#f5a623","#d9730d")}${sc("💰","مبيعات اليوم",td.reduce((s,x)=>s+Number(x.total),0)+" ر.س","#1fb35f","#0b6b3a")}${sc("📦","المنتجات",a.count||0,"#8a5cff","#4b2bd1")}${sc("💬","رسائل جديدة",b.count||0,"#f0506e","#b01a30")}</div>
<div class="card"><h3>آخر الطلبات</h3>${O.slice(0,6).map(x=>`<div class="li"><span><b>${esc(x.order_no)}</b><br><small>${esc(x.customer_name)}</small></span><span style="text-align:left">${chip(x.status)}<br><b>${x.total}</b> ريال</span></div>`).join("")||'<p class="em">لا توجد طلبات بعد</p>'}</div>`}
async function orders(){const{data}=await sb.from("nexo_orders").select("*").order("created_at",{ascending:false}).limit(300);OD=data||[];
$("main").innerHTML=`<div class="bar"><input id="q" placeholder="🔎 بحث برقم الطلب أو الاسم أو الجوال" oninput="ol()"></div><div class="chips" id="oc"></div><div class="grid" id="gl"></div>`;ol()}
function ol(){const q=($("q").value||"").toLowerCase();
$("oc").innerHTML=["الكل",...STS].map(s=>`<button class="ft ${s==OF?"on":""}" onclick="OF='${s}';ol()">${s} (${s=="الكل"?OD.length:OD.filter(o=>o.status==s).length})</button>`).join("");
$("gl").innerHTML=OD.filter(o=>(OF=="الكل"||o.status==OF)&&(o.order_no+o.customer_name+o.phone).toLowerCase().includes(q)).map(o=>`<div class="card ${o.status=="جديد"?"nw":""}"><div class="li" style="padding-top:0"><b style="font-size:18px">${esc(o.order_no)}</b>${chip(o.status)}</div>
